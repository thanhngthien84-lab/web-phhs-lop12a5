<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THANH XUÂN 12A1</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Quicksand"', 'sans-serif'],
                    },
                    colors: { 
                        primary: '#1e1b4b', // Deep indigo
                        secondary: '#312e81', 
                        accent: '#f59e0b', // Amber
                        blueAccent: '#3b82f6', 
                        lightBg: '#f8fafc', 
                        cardBg: '#ffffff' 
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'spin-slow': 'spin 8s linear infinite',
                        'bounce-slight': 'bounceSlight 2s infinite ease-in-out'
                    },
                    keyframes: { 
                        fadeIn: { 
                            '0%': { opacity: '0', transform: 'translateY(15px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        }
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                        normal: '0',
                        wide: '0.02em',
                        wider: '0.05em',
                        widest: '0.1em',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
       body { 
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9; 
            color: #0f172a; 
            margin: 0; 
            height: 100dvh; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Scrollbar for a premium look */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Toast Notifications */
        .toast { 
            position: fixed; bottom: 24px; right: 24px; 
            padding: 16px 24px; border-radius: 16px; 
            color: white; font-weight: 700; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            display: flex; align-items: center; gap: 12px; 
            z-index: 1000; 
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .toast.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .toast.fadeOut { animation: fadeOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Typography refinements */
        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }
        
        .tracking-widest {
            letter-spacing: 0.1em;
        }

        /* Banner effects */
        .bg-banner { position: relative; overflow: hidden; }
        .bg-banner::before { 
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); 
            animation: spin 40s linear infinite; pointer-events: none; 
        }
        
        /* Glassmorphism utilities */
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Print adjustments */
        @media print {
            body * { visibility: hidden; }
            #report-container, #report-container * { visibility: visible; }
            #report-container { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
            .print\:hidden { display: none !important; }
        }
    </style>
</head>
<body>
    <!-- App Mount Points -->
    <div id="app" class="flex h-screen w-full bg-slate-100"></div>
    <div id="toast-container"></div>
    <div id="timer-drawer-container"></div>

   <script>
       let state = {
    currentTab: 'tong-quan',
    auth: { loggedIn: true, role: 'gvcn' }, 
            theme: { month: "CHỦ ĐIỂM THÁNG", title: "CHUYẾN TÀU THANH XUÂN", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" },
            admin: { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP 12A1", classAvatarUrl: "" },
            tasks: [], 
            journeys: [],
            settings: { sidebarPosition: 'left', deductStarsOnRedeem: true },
            settingsTab: 'thong-tin',
            students: [], // Đã thêm khởi tạo mảng học sinh để tránh lỗi
            groups: [
                { id: "g1", name: "Tổ 1", color: "text-red-500", avatarUrl: "" },
                { id: "g2", name: "Tổ 2", color: "text-green-500", avatarUrl: "" },
                { id: "g3", name: "Tổ 3", color: "text-yellow-500", avatarUrl: "" },
                { id: "g4", name: "Tổ 4", color: "text-blueAccent", avatarUrl: "" }
            ],
            rewards: [],
            attendanceRecords: {},
            scores: [],
            teacherComments: [],
            attendanceTab: 'diem-danh',
            
            // --- Cập nhật State cho form Tích điểm mới ---
            pointsForm: {
                actionType: 'add', // 'add' or 'subtract'
                targetType: 'student', // 'student', 'group', or 'class'
                selectedTargetId: '', // student id or group name, empty if class
                pointsVal: 0,
                category: 'Học tập',
                reason: '',
                note: ''
            },
            
            selectedStudentForRewards: null,
            editingStudentId: null,
            editingGroupId: null,
            criteria: null
        };

       let timerInterval = null;
        let timerSeconds = 0;
        let isTimerRunning = false;
        let isDataLoaded = false;

        // --- BỔ SUNG CÁC HÀM XỬ LÝ NGÀY THÁNG BỊ THIẾU ---
        const _d = new Date();
        let currentAttendanceDate = `${_d.getFullYear()}-${String(_d.getMonth() + 1).padStart(2, '0')}-${String(_d.getDate()).padStart(2, '0')}`;
        
        window.formatDateForDisplay = function(dStr) { 
            if(!dStr) return '';
            return dStr.split('-').reverse().join('/'); 
        };

        window.getTodayString = function() {
            const date = new Date();
            return `${String(date.getDate()).padStart(2, '0')}${String(date.getMonth() + 1).padStart(2, '0')}${date.getFullYear()}`;
        };
        // ------------------------------------------------

        const menuItems = [
            { id: 'tong-quan', icon: 'ph-squares-four', label: 'Trang chủ' },
            { id: 'hoc-sinh', icon: 'ph-users', label: 'Học sinh' },
            { id: 'thoi-khoa-bieu', icon: 'ph-calendar-list', label: 'Thời khóa biểu' },
            { id: 'so-do-lop', icon: 'ph-grid-four', label: 'Sơ đồ lớp' },
            { id: 'doi-qua', icon: 'ph-gift', label: 'Quà tặng' },
            { id: 'nhom-thi-dua', icon: 'ph-flag-pennant', label: 'Tổ thi đua' },
            { id: 'diem-danh', icon: 'ph-calendar-check', label: 'Điểm danh' },
            { id: 'vong-quay', icon: 'ph-cards', label: 'Gọi Tên Ngẫu Nhiên' },
            { id: 'dong-ho', icon: 'ph-timer', label: 'Công cụ' },
            { id: 'lich-bao-giang', icon: 'ph-notebook', label: 'Lịch báo giảng' },
            { id: 'xep-hang', icon: 'ph-trophy', label: 'Tuyên Dương' },
           { id: 'bao-cao', icon: 'ph-chart-bar', label: 'Sổ theo dõi' },
            { id: 'tram-dong-hanh', icon: 'ph-hands-clapping', label: 'Trạm đồng hành' },
            { id: 'cai-dat', icon: 'ph-gear', label: 'Cài đặt' }
        ];

        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }
        function toInlineJsValue(value) {
            return typeof value === 'number' && Number.isFinite(value)
                ? String(value)
                : `'${escapeInlineJs(String(value ?? ''))}'`;
        }
        
        function generateUniqueCode() {
            let code, attempts = 0;
            const currentStudents = state.students || [];
            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (currentStudents.some(s => s.code === code) && attempts < 100);
            return code;
        }

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applyStateDefaults() {
            if (!state.theme) state.theme = { month: "CHỦ ĐIỂM THÁNG 9", title: "CHÀO MỪNG NĂM HỌC MỚI", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" };
            if (!state.theme.bannerColorClass) state.theme.bannerColorClass = "from-[#1e1b4b] to-[#312e81]";
            if (state.theme.teacherMsgTitle === "CÔ THÙY NHẮN") state.theme.teacherMsgTitle = "Thầy/cô muốn gửi gắm";
            if (state.theme.teacherMsgSign === "Cô Đỗ Thị Thùy") state.theme.teacherMsgSign = "";
            if (!state.admin) state.admin = { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP 12A1", classAvatarUrl: "" };
            if (!state.settings) state.settings = { sidebarPosition: 'left', deductStarsOnRedeem: true };
            if (!state.attendanceRecords) state.attendanceRecords = {};
            if (!state.scores) state.scores = [];
            if (!state.teacherComments) state.teacherComments = [];
            if (!state.attendanceTab) state.attendanceTab = 'diem-danh';
            if (!state.students) state.students = [];
            if (!state.timetable) state.timetable = { dayUrl: '', extraUrl: '' };
            if (!state.timetable) state.timetable = { dayUrl: '', extraUrl: '' };
            if (!state.tasks) state.tasks = [];
            if (!state.journeys) state.journeys = [];
            const defaultRewards = [
                { id: 'r1', name: 'Đổi chỗ ngồi 1 ngày', cost: 10, icon: 'ph-seat', color: 'text-purple-600', bg: 'bg-purple-100', desc: 'Chọn chỗ ngồi yêu thích' },
                { id: 'r2', name: 'Nhạc theo yêu cầu', cost: 20, icon: 'ph-music-notes', color: 'text-blueAccent', bg: 'bg-blue-100', desc: 'Bật bài hát yêu thích giờ ra chơi' },
                { id: 'r3', name: 'Miễn làm bài tập', cost: 50, icon: 'ph-files', color: 'text-emerald-600', bg: 'bg-emerald-100', desc: 'Miễn 1 bài tập về nhà' },
                { id: 'r4', name: 'Quà tặng bí mật', cost: 100, icon: 'ph-gift', color: 'text-orange-600', bg: 'bg-orange-100', desc: 'Nhận phần quà đặc biệt từ GV' }
            ];
            if (!state.rewards || state.rewards.length === 0) state.rewards = defaultRewards;

            state.students.forEach(s => { 
                if (typeof s.stars === 'undefined') s.stars = s.points; 
                if (!s.code) s.code = generateUniqueCode();
                if (!s.history) s.history = []; // Khởi tạo mảng lịch sử nếu chưa có
            });

            const defaultCriteria = {
                version: 2,
                positive: [
                    { points: 5, reason: "Đạt điểm 9,10", category: "Học tập" }, 
                    { points: 3, reason: "Giúp đỡ bạn bè", category: "Phong trào" }, 
                    { points: 10, reason: "Làm bài tập đầy đủ", category: "Học tập" }, 
                    { points: 10, reason: "Đóng góp phong trào", category: "Phong trào" }, 
                    { points: 15, reason: "Điểm cao kiểm tra", category: "Học tập" }, 
                    { points: 2, reason: "Đi học đúng giờ", category: "Chuyên cần" },
                    { points: 5, reason: "Trực nhật xuất sắc", category: "Nề nếp" }
                ],
                negative: [
                    { points: 5, reason: "Nói chuyện riêng", category: "Kỷ luật" }, 
                    { points: 10, reason: "Không làm bài tập", category: "Học tập" }, 
                    { points: 3, reason: "Quên đồ dùng học tập", category: "Học tập" }, 
                    { points: 3, reason: "Ăn vặt trong lớp", category: "Kỷ luật" }, 
                    { points: 2, reason: "Đi học muộn", category: "Chuyên cần" },
                    { points: 5, reason: "Mất trật tự trong giờ", category: "Kỷ luật" },{ points: 15, reason: "Sử dụng điện thoại", category: "Kỷ luật" }
                ]
            };
            if (!state.criteria || state.criteria.version !== 2) state.criteria = defaultCriteria;
           // Backwards compatibility for existing criteria missing category
            state.criteria.positive.forEach(c => { if(!c.category) c.category = "Khác"; });
            state.criteria.negative.forEach(c => { if(!c.category) c.category = "Khác"; });
            
            if (!state.timetable) state.timetable = { dayUrl: '', extraUrl: '' };

            if (!state.dailySchedule) {
                state.dailySchedule = {
                    1: [ // Thứ 2
                        { period: 'Tiết 1', time: '07:30 - 08:15', subject: 'Chào cờ', teacher: 'GVCN' },
                        { period: 'Tiết 2', time: '08:15 - 09:00', subject: 'Hóa Học', teacher: 'Cô Thùy' },
                        { period: 'Tiết 3', time: '09:10 - 09:55', subject: 'Toán', teacher: 'Thầy Hùng' },
                        { period: 'Tiết 4', time: '10:00 - 10:45', subject: 'Vật Lý', teacher: 'Cô Lan' }
                    ]
                };
            }
        }
        function initDefaultStudents() {
  state.students = [];
}

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `<i class="ph-fill ph-check-circle text-2xl drop-shadow"></i> <span>${message}</span>` : `<i class="ph-fill ph-warning-circle text-2xl drop-shadow"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('fadeOut'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function getAvatarImg(url, name, classes = "w-10 h-10") {
            const safeName = name || 'User'; const seed = encodeURIComponent(safeName);
            const finalUrl = url || `https://api.dicebear.com/7.x/notionists/svg?seed=${seed}&backgroundColor=e0e7ff,fef08a,dcfce7,fee2e2`;
            return `<img src="${finalUrl}" class="${classes} rounded-full object-cover flex-shrink-0 border-2 border-white shadow-sm">`;
        }

window.switchSettingsTab = function(tab) {
    state.settingsTab = tab;
    renderLayout();
};

window.switchTab = function(tabId) { 
    // Giới hạn tab nếu là Ban cán sự
    if (state.auth && state.auth.role === 'bancansu') {
        const allowed = ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'diem-danh'];
        if (!allowed.includes(tabId)) {
            showToast("Ban cán sự chỉ có quyền truy cập Trang chủ, Học sinh, Thời khóa biểu và Điểm danh!", "error");
            return;
        }
    }
    
    // Giới hạn tab nếu là Ban giám hiệu
    if (state.auth && state.auth.role === 'bgh') {
        const allowed = ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh'];
        if (!allowed.includes(tabId)) {
            showToast("Ban giám hiệu chỉ có quyền truy cập Trang chủ, Học sinh, TKB, Sơ đồ, Điểm danh, Sổ theo dõi và Trạm đồng hành!", "error");
            return;
        }
    }
    
    // SỬA LỖI TẠI ĐÂY: Nếu bấm vào Cài đặt từ menu, luôn đưa về mục Thông tin chung
    if (tabId === 'cai-dat') {
        state.settingsTab = 'thong-tin';
    }
    
    state.currentTab = tabId; 
    renderLayout(); 
};
function renderSidebar() {
    // Lọc menu theo quyền đăng nhập
    let activeMenuItems = menuItems;
    if (state.auth && state.auth.role === 'bancansu') {
        activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'diem-danh'].includes(item.id));
    } else if (state.auth && state.auth.role === 'bgh') {
        activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh'].includes(item.id));
    }

    const menuHtml = activeMenuItems.map(item => {
        if (item.id === 'dong-ho') {
            return `<button onclick="openTimerDrawer()" class="w-full flex items-center gap-4 px-6 py-3.5 mb-2 rounded-2xl transition-all duration-300 text-indigo-200 hover:bg-white/10 hover:text-white font-semibold group"><div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/20 transition-colors"><i class="ph-fill ${item.icon} text-xl"></i></div><span class="text-sm tracking-wide">${item.label}</span></button>`;
        }
        const isActive = state.currentTab === item.id;
        return `
            <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-4 px-6 py-3.5 mb-2 rounded-2xl transition-all duration-300 group relative overflow-hidden ${isActive ? 'text-white' : 'text-indigo-200 hover:text-white hover:bg-white/5'}">
                ${isActive ? '<div class="absolute inset-0 bg-gradient-to-r from-blueAccent to-indigo-600 opacity-90"></div><div class="absolute inset-0 bg-[url(\'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNykiLz48L3N2Zz4=\')]"></div>' : ''}
                <div class="relative z-10 flex items-center gap-4 w-full">
                    <div class="p-2 rounded-xl ${isActive ? 'bg-white/20 shadow-inner' : 'bg-transparent group-hover:bg-white/10'} transition-colors"><i class="ph-fill ${item.icon} text-xl"></i></div>
                    <span class="text-sm tracking-wide font-bold">${item.label}</span>
                </div>
            </button>`;
    }).join('');
    
    const classAvatarContent = state.admin.classAvatarUrl ? `<img src="${state.admin.classAvatarUrl}" class="w-full h-full object-cover">` : `<i class="ph-fill ph-student text-white text-3xl"></i>`;
    
    return `
        <!-- Thêm 'hidden md:flex' để PC giữ nguyên, Điện thoại tự ẩn -->
        <aside class="hidden md:flex w-[280px] bg-primary text-white flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.05)] z-20 flex-shrink-0 print:hidden relative border-r border-white/10">
            <div class="flex flex-col items-center justify-center p-8 pb-6 relative overflow-hidden">
                <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                <div class="relative group cursor-pointer mb-5 z-10" onclick="document.getElementById('class-avatar-upload').click()" title="Thay đổi ảnh đại diện">
                    <div class="w-20 h-20 bg-gradient-to-tr from-blueAccent to-purple-500 rounded-3xl flex items-center justify-center shadow-lg border-2 border-white/20 transform group-hover:scale-105 transition-all overflow-hidden relative group-hover:shadow-blueAccent/50">
                        ${classAvatarContent}
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-camera text-white text-xl"></i></div>
                    </div>
                </div>
                <input type="file" id="class-avatar-upload" class="hidden" accept="image/*" onchange="handleClassAvatarUpload(event)">

function renderBottomNav() {
    let activeMenuItems = menuItems;
    if (state.auth && state.auth.role === 'bancansu') {
        activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'diem-danh'].includes(item.id));
    } else if (state.auth && state.auth.role === 'bgh') {
        activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh'].includes(item.id));
    }

    const menuHtml = activeMenuItems.map(item => {
        const isActive = state.currentTab === item.id;
        
        // Căn chỉnh giao diện nút y như mẫu ảnh của cô
        const activeClass = isActive 
            ? "text-white bg-blue-600 shadow-[0_4px_15px_rgba(37,99,235,0.4)] transform -translate-y-1.5" 
            : "text-[#94a3b8] hover:text-white hover:bg-white/5";

        // Xử lý các nút bấm đặc biệt
        let onclickAction = `switchTab('${item.id}')`;
        if (item.id === 'dong-ho') onclickAction = 'openTimerDrawer()';
        if (item.id === 'tich-diem') onclickAction = `switchTab('cai-dat'); switchSettingsTab('tich-diem');`;

        return `
        <button onclick="${onclickAction}" class="flex flex-col items-center justify-center min-w-[70px] w-20 py-2 rounded-[1rem] transition-all duration-300 ${activeClass}">
            <i class="${isActive ? 'ph-fill' : 'ph-bold'} ${item.icon} text-[22px] mb-1"></i>
            <span class="text-[10px] font-bold whitespace-nowrap tracking-wide">${item.label}</span>
        </button>
        `;
    }).join('');

    return `
        <!-- Thẻ nav có chứa 'md:hidden' nghĩa là trên Máy tính nó sẽ hoàn toàn tàng hình -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-[#1e1b4b] border-t border-indigo-900 shadow-[0_-10px_40px_rgba(0,0,0,0.2)] z-50 overflow-x-auto pb-1 custom-scrollbar">
            <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
            <div class="flex items-center gap-1.5 px-3 pt-2 pb-2 relative z-10 w-max min-w-full">
                ${menuHtml}
            </div>
        </nav>
    `;
}

            // Xóa nội dung trong khung chứa chung

                    <div id="modal-container" class="print:hidden"></div>
                </div>
                
                ${isRightSidebar ? renderSidebar() : ''}
            `;

                }, 50);

        }
    function renderViewTongQuan() {
            // Lấy dữ liệu cơ bản
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const todayRecord = state.attendanceRecords[todayStr] || {};
            let absentCount = 0;
            state.students.forEach(s => {
                const status = todayRecord[s.id];
                if (status === 'excused' || status === 'unexcused') absentCount++;
            });
            
            // --- KHAI BÁO BIẾN CƠ BẢN VÀ TÍNH TOÁN ---
            const totalStudents = state.students.length;
            const presentStudents = totalStudents - absentCount;
            const goodPointsCount = state.students.filter(s => (s.points || 0) >= 10).length;
            
            // Tính % Học tập
            let learningPercent = 100;
            if (totalStudents > 0) {
                const positiveStudents = state.students.filter(s => (s.points || 0) >= 0).length;
                learningPercent = Math.round((positiveStudents / totalStudents) * 100);
            }
        
            // Đánh giá Nền nếp
            const negativeStudentsCount = state.students.filter(s => (s.points || 0) < 0).length;
            const totalIssues = absentCount + negativeStudentsCount;
            
            let disciplineStatus = "Tốt";
            let disciplineColor = "text-emerald-500";
            let disciplineIcon = "🟢";
            
            if (totalStudents > 0) {
                const issueRatio = totalIssues / totalStudents;
                if (issueRatio >= 0.3) { 
                    disciplineStatus = "Cần cố gắng";
                    disciplineColor = "text-red-500";
                    disciplineIcon = "🔴";
                } else if (issueRatio > 0.1) { 
                    disciplineStatus = "Khá";
                    disciplineColor = "text-yellow-500";
                    disciplineIcon = "🟡";
                }
            }

            // Xử lý dữ liệu Bảng Vàng (Top 3)
            const sortedStudents = [...state.students].sort((a, b) => (b.points || 0) - (a.points || 0));
            const top3StudentsHtml = sortedStudents.slice(0, 3).map((s, index) => {
                const medals = ['🥇', '🥈', '🥉'];
                const weekProg = s.points > 0 ? Math.floor((Math.sin(s.id * 10) + 1) * 5) + 2 : 0;
                return `
                    <div class="bg-white/10 hover:bg-white/20 p-4 rounded-2xl border border-white/5 transition-all cursor-pointer group" onclick="switchTab('tich-diem'); selectStudentForPoints(${toInlineJsValue(s.id)})">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-2xl">${medals[index]}</span>

                        </div>
                        <div class="pl-10 text-xs text-emerald-300 font-bold flex items-center gap-1">

                        </div>
                    </div>

            }).join('');
            
            // Xử lý dữ liệu Tiến Bộ (Top 3)
            const studentsWithProgress = state.students.map(s => {
                const weekProg = (s.points || 0) > 0 ? Math.floor((Math.sin(s.id * 10) + 1) * 15) + 5 : 0; 
                return { ...s, weekProg: Math.min(weekProg, s.points || 0) };
            });
            const topProgressHtml = [...studentsWithProgress].sort((a,b) => b.weekProg - a.weekProg).slice(0, 3).map(s => {
                const stars = '⭐'.repeat(Math.min(3, Math.ceil(s.weekProg / 5))) || '⭐';
                return `
                    <div class="bg-white/10 hover:bg-white/20 p-4 rounded-2xl border border-white/5 transition-all cursor-pointer group mb-3" onclick="switchTab('tich-diem'); selectStudentForPoints(${toInlineJsValue(s.id)})">

                        <div class="flex items-center gap-2 text-sm text-yellow-300 font-bold">
                            ${stars} <span class="text-white ml-1">+${s.weekProg} điểm tuần này <i class="ph-bold ph-arrow-up text-emerald-300"></i></span>
                        </div>
                    </div>
                `;
            }).join('');
            
            // XỬ LÝ VIỆC CẦN LÀM ĐỘNG
            const tasks = state.tasks || [];
            const tasksHtml = tasks.length === 0 
                ? '<div class="text-center py-12 text-slate-400 italic font-medium">✨ Thầy/cô đã xử lý xong mọi việc!</div>'

</button>

                                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-[160px] overflow-y-auto custom-scrollbar pr-2 py-1 relative">

                                        <input type="number" id="pf-points-val" value="${pf.pointsVal || ''}" min="0" oninput="state.pointsForm.pointsVal = Math.abs(parseInt(this.value)||0); validatePointsForm();" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-black text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all">

                                        <select onchange="updatePointsForm('category', this.value)" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all appearance-none">
                                            ${categoryOptionsHtml}

                                    <input type="text" id="pf-reason" value="${escapeHtmlAttr(pf.reason)}" oninput="state.pointsForm.reason = this.value; validatePointsForm();" placeholder="Vd: Đóng góp phong trào" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all">

        }

        // --- Helper functions for the new Points Form ---
        window.updatePointsForm = function(key, value) {
            state.pointsForm[key] = value;
            
            // If changing action type, reset quick selection related fields
            if (key === 'actionType') {
                state.pointsForm.pointsVal = 0;
                state.pointsForm.reason = '';
            }
            renderLayout();
        };

        // --- Validate input dynamically to prevent full re-render on typing ---
        window.validatePointsForm = function() {
            const pf = state.pointsForm;
            let canSubmit = false;
            
            if (pf.pointsVal > 0 && pf.reason.trim() !== '') {
                if (pf.targetType === 'class') canSubmit = true;
                else if (pf.selectedTargetId) canSubmit = true;
            }

            const btn = document.getElementById('points-submit-btn');
            const badge = document.getElementById('points-preview-badge');

            if (btn) {
                if (canSubmit) {
                    btn.disabled = false;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-emerald-600 text-white hover:bg-emerald-700";
                } else {
                    btn.disabled = true;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-slate-300 text-slate-500 cursor-not-allowed opacity-70";
                }
            }
            
            if (badge) {
                const sign = pf.actionType === 'add' ? '+' : '-';
                badge.innerText = `${sign}${pf.pointsVal > 0 ? pf.pointsVal : 0}đ`;
            }
        };

        window.applyQuickCriterion = function(reason, points, category) {
            state.pointsForm.reason = reason;
            state.pointsForm.pointsVal = points;
            state.pointsForm.category = category || 'Khác';
            renderLayout();
        };

        window.resetPointsForm = function() {
            state.pointsForm = {
                actionType: 'add', targetType: 'student', selectedTargetId: '', pointsVal: 0, category: 'Học tập', reason: '', note: ''
            };
            renderLayout();
        };

      window.executePointsSubmission = function() {
            const pf = state.pointsForm;
            const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
            
            if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
            if (!pf.reason.trim()) return showToast("Vui lòng nhập lý do!", "error");
            let targetStudents = [];
            let successMsg = "";
            
            if (pf.targetType === 'student') {
                const s = state.students.find(x => x.id.toString() === pf.selectedTargetId.toString());
                if (!s) return showToast("Vui lòng chọn học sinh!", "error");
                targetStudents.push(s);
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho ${s.name}`;
            } 
            else if (pf.targetType === 'group') {
                targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
                if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
            } 
            else if (pf.targetType === 'class') {
                targetStudents = [...state.students];
                if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
            }
            
            // --- TÍNH NĂNG TỰ ĐỘNG HỌC MẪU MỚI ---
            const currentReason = pf.reason.trim();
            const absVal = Math.abs(pointsToApply);
            const targetCriteriaList = pf.actionType === 'add' ? state.criteria.positive : state.criteria.negative;
            
            const isExist = targetCriteriaList.find(c => c.reason.toLowerCase() === currentReason.toLowerCase() && c.points === absVal);
            if (!isExist) {
                targetCriteriaList.push({
                    points: absVal,
                    reason: currentReason,
                    category: pf.category || 'Khác'
                });
            }
            
            // Apply points and log history
            const historyEntry = {
                id: Date.now(),
                date: new Date().toISOString(),
                points: pointsToApply,
                reason: currentReason + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`
            };
            
            targetStudents.forEach(s => {
                // BỎ Math.max ĐỂ TỔNG ĐIỂM XUỐNG ĐƯỢC SỐ ÂM
                s.points = (s.points || 0) + pointsToApply;
                
                // Giữ nguyên Math.max cho phần Sao đổi quà
                s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
                
                if (!s.history) s.history = [];
                s.history.push({...historyEntry, id: Date.now() + Math.random()}); 
            });
            saveData();
            
            state.pointsForm.pointsVal = 0;
            state.pointsForm.reason = '';
            state.pointsForm.note = '';
            
            renderLayout();
            showToast(successMsg, pointsToApply > 0 ? "success" : "error");
            if (pointsToApply > 0) triggerConfetti();
        };
        function selectStudentForRewards(id) { state.selectedStudentForRewards = id; renderLayout(); }

        // Keeping these two logic functions just in case they are referenced somewhere else historically
        function awardPoints(points, reason) {
            console.log('Legacy awardPoints called, routing to form...', points, reason);
        }
        function awardCustomPoints() {
            console.log('Legacy custom points called');
        }
        function saveNewCriterion() {
            const val = state.pointsForm.pointsVal;
            const reason = state.pointsForm.reason.trim();
            const category = state.pointsForm.category;
            
            if (isNaN(val) || val <= 0) return showToast("Vui lòng nhập số điểm > 0 để lưu mẫu!", "error");
            if (!reason) return showToast("Vui lòng nhập lý do tiêu chí!", "error");
            
            if (state.pointsForm.actionType === 'add') {
                state.criteria.positive.push({ points: val, reason: reason, category: category });
            } else {
                state.criteria.negative.push({ points: val, reason: reason, category: category });
            }
            saveData(); renderLayout(); showToast("Đã lưu tiêu chí mới thành công!");
        }
        
        function deleteCriterion(type, index) {
            if (confirm("Xóa tiêu chí này khỏi danh sách?")) { state.criteria[type].splice(index, 1); saveData(); renderLayout(); showToast("Đã xóa"); }
        }

            const student = state.students.find(s => s.id === selectedStudentId);

                    <div class="text-xs font-black px-3 py-1 rounded-xl bg-orange-50 text-orange-600 border border-orange-100 flex items-center justify-center gap-1.5 w-full"><i class="ph-fill ph-star text-accent"></i> ${s.stars || 0}</div>
                </button>

                              `<button class="w-full py-3.5 bg-slate-50 border border-slate-200 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Thiếu ${item.cost - (student.stars||0)} sao</button>`;
                
                // Khung hiển thị tự điều chỉnh ảnh
                const imageDisplayHtml = item.imageUrl 
                    ? `<div class="w-full h-40 mb-5 bg-slate-50/80 rounded-2xl flex items-center justify-center overflow-hidden border border-slate-100 p-2 group-hover:shadow-md transition-all">
                           <img src="${item.imageUrl}" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500 drop-shadow-sm">

                    : `<div class="w-16 h-16 ${item.bg} rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-sm border border-white ring-4 ring-slate-50"><i class="ph-fill ${item.icon} text-3xl ${item.color}"></i></div>`;

                return `

                        <div class="absolute top-0 right-0 w-32 h-32 ${item.bg.replace('100', '200')}/40 rounded-bl-full -mr-10 -mt-10 transition-transform duration-500 group-hover:scale-125 z-0"></div>
                        <div class="bg-white rounded-[1.6rem] p-6 md:p-8 flex flex-col h-full relative z-10">
                            ${imageDisplayHtml}
                            <h4 class="font-black text-slate-800 text-xl mb-2 leading-tight">${item.name}</h4>
                            ${item.desc ? `<p class="text-sm text-slate-500 mb-8 font-medium line-clamp-2">${item.desc}</p>` : '<div class="h-6 mb-8"></div>'}
                            <div class="mt-auto flex items-end justify-between mb-6 pt-5 border-t border-slate-100 border-dashed">
                                <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">CẦN ĐỂ ĐỔI</span><div class="flex items-center gap-1.5 font-black text-slate-800 text-3xl">${item.cost} <i class="ph-fill ph-star text-accent animate-pulse"></i></div></div>
                            </div>

                `;
            }).join('');

            return `
                <div class="max-w-7xl mx-auto animate-fade-in space-y-8 pb-12">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center py-2 border-b border-slate-200 pb-6 gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><i class="ph-fill ph-storefront text-accent"></i> Cửa Hàng Đổi Quà</h2>
                            <p class="text-slate-500 text-sm font-medium mt-1">Dùng sao tích lũy để đổi lấy những phần thưởng hấp dẫn.</p>

                            <div class="flex-1 w-full text-center sm:text-left">

                </div>
            `;
        }

        function executeRedeem(studentId, itemId) {
            const student = state.students.find(s => s.id === parseInt(studentId));
            const item = state.rewards.find(i => i.id === itemId);
            if (student && item && (student.stars || 0) >= item.cost) {
                if(confirm(`Đổi "${item.name}" cho ${student.name} với giá ${item.cost} sao?\nSau khi đổi, sao sẽ bị trừ nhưng tổng điểm không đổi.`)) {
                    student.stars -= item.cost; saveData(); renderLayout(); showToast(`Đã đổi quà thành công!`); triggerConfetti();
                }
            }
        }

       function renderViewNhomThiDua() {

            const maxGroupPoints = Math.max(...groupsWithStats.map(g => g.totalPoints), 1);

                return `
                    <div class="rounded-[2rem] bg-white relative group h-full transition-all duration-300 ${wrapperClass} flex flex-col">

                        <div class="${innerClass} h-full flex flex-col overflow-hidden relative z-10 flex-1">
                            <div class="p-6 pb-5 ${bgHeader} relative border-b border-slate-100">

                                        <div>
                                            <h3 class="font-black text-slate-800 text-xl tracking-tight leading-none mb-2">${g.name}</h3>
                                            <div class="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded inline-block"><i class="ph-fill ph-users"></i> ${g.members.length} Thành viên</div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end flex-shrink-0">
                                        <div class="px-4 py-2.5 rounded-xl ${pointColor} flex items-center gap-1.5">

                                    </div>
                                </div>
                                <div class="absolute top-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-lg z-20 border border-slate-100">
                                    <button onclick="pickRandomInGroup('${g.id}')" title="Quay random trong nhóm" class="text-slate-500 hover:text-purple-600 p-2 rounded-lg bg-slate-50 hover:bg-purple-50 transition-colors"><i class="ph-fill ph-dice-three text-lg"></i></button>
                                    <button onclick="openEditGroupModal('${g.id}')" title="Sửa nhóm" class="text-slate-500 hover:text-blueAccent p-2 rounded-lg bg-slate-50 hover:bg-blue-50 transition-colors"><i class="ph-fill ph-pencil-simple text-lg"></i></button>

            return `

                const currentRecord = state.attendanceRecords[currentAttendanceDate];
                const sortedDates = Object.keys(state.attendanceRecords).sort((a,b) => new Date(b) - new Date(a));

                const tableRowsHtml = state.students.map((s, idx) => {
                    const status = currentRecord[s.id] || null;
                    
                    // Hàm render nút bấm điểm danh
                    const renderButton = (val, label, colorTheme) => {
                        const isChecked = status === val;
                        let activeClass = '', idleClass = '';
                        
                        // Màu khi đang chọn (đậm)
                        if (colorTheme === 'emerald') { activeClass = 'bg-white text-emerald-500 border-emerald-500'; idleClass = 'bg-white text-emerald-500/50 border-emerald-500/30 hover:border-emerald-500/50'; }
                        else if (colorTheme === 'yellow') { activeClass = 'bg-white text-yellow-500 border-yellow-500'; idleClass = 'bg-white text-yellow-500/50 border-yellow-500/30 hover:border-yellow-500/50'; }
                        else if (colorTheme === 'blue') { activeClass = 'bg-white text-blue-500 border-blue-500'; idleClass = 'bg-white text-blue-500/50 border-blue-500/30 hover:border-blue-500/50'; }
                        else if (colorTheme === 'red') { activeClass = 'bg-white text-red-500 border-red-500'; idleClass = 'bg-white text-red-500/50 border-red-500/30 hover:border-red-500/50'; }
                        
                        return `<button onclick="markAttendance(${toInlineJsValue(s.id)}, '${val}')" class="w-full h-11 rounded-[0.8rem] border-[1.5px] ${isChecked ? activeClass + ' font-bold' : idleClass + ' font-medium'} transition-colors text-xs flex items-center justify-center">${label}</button>`;
                    };

                    // Lấy lịch sử vi phạm
                    let lateDates = [], excusedDates = [], unexcusedDates = [];
                    sortedDates.forEach(date => {
                        const dStatus = state.attendanceRecords[date][s.id];
                        if (!dStatus || dStatus === 'present') return;
                        const p = date.split('-'); const formattedDate = `${p[2]}/${p[1]}`;
                        if (dStatus === 'late') lateDates.push(formattedDate); 
                        else if (dStatus === 'excused') excusedDates.push(formattedDate); 
                        else if (dStatus === 'unexcused') unexcusedDates.push(formattedDate);

                    // Khối hiển thị lịch sử vi phạm ngay dưới tên học sinh

                    if (lateDates.length > 0 || excusedDates.length > 0 || unexcusedDates.length > 0) {
                        let badges = '';
                        if (lateDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Đi muộn</span> <span class="text-xs text-slate-600 font-medium">${lateDates.join(', ')}</span></div>`;
                        if (excusedDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Vắng (P)</span> <span class="text-xs text-slate-600 font-medium">${excusedDates.join(', ')}</span></div>`;
                        if (unexcusedDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-red-100 text-red-500 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Vắng (KP)</span> <span class="text-xs text-slate-600 font-medium">${unexcusedDates.join(', ')}</span></div>`;
                        
                        historyHtml = `
                            <div class="mt-4 flex flex-col gap-2 pl-2 border border-dashed border-slate-200 rounded-xl p-3 bg-slate-50/50 ml-14 w-max min-w-[250px]">
                                <div class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-1">LỊCH SỬ VI PHẠM CHUYÊN CẦN</div>
                                <div class="flex flex-col gap-1.5">${badges}</div>
                            </div>
                        `;
                    }

                    return `
                        <div class="flex flex-col xl:flex-row py-5 border-b border-slate-100 hover:bg-slate-50/50 transition-colors px-6 md:px-8 gap-6 bg-white items-start xl:items-center">
                            <div class="w-full xl:w-5/12 flex flex-col">
                                <div class="flex items-center gap-4">
                                    ${getAvatarImg(s.avatarUrl, s.name, "w-10 h-10")}

                            </div>
                            <div class="w-full xl:w-7/12 flex items-center gap-3 flex-wrap sm:flex-nowrap">
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('present', 'Có mặt', 'emerald')}</div>
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('late', 'Đi muộn', 'yellow')}</div>
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('excused', 'Vắng (P)', 'blue')}</div>
                                <div class="w-[calc(50%-0.375rem)] sm:w-auto flex-1">${renderButton('unexcused', 'Vắng (KP)', 'red')}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                contentHtml = `
                    <div class="flex flex-wrap justify-between items-center gap-4 bg-white p-5 rounded-[2rem] shadow-sm border border-slate-200 mb-6 relative z-10">
                        <div class="flex bg-slate-50 p-1.5 rounded-xl w-full md:w-auto">
                            <button onclick="switchAttendanceTab('diem-danh')" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold bg-white text-blueAccent shadow-sm">Thực hiện điểm danh</button>
                            <button onclick="switchAttendanceTab('thong-ke')" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-800 transition-colors">Bảng thống kê</button>
                        </div>
                        <div class="flex gap-4 items-center w-full md:w-auto">
                            <div class="relative">
                                <input type="date" value="${currentAttendanceDate}" onchange="changeAttendanceDate(this.value)" class="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:border-blueAccent w-full md:w-48 shadow-sm">
                            </div>
                            <button onclick="markAllPresent()" class="px-5 py-2.5 bg-emerald-500 text-white font-bold rounded-xl shadow-md hover:bg-emerald-600 flex items-center justify-center gap-2 text-sm transition-all"><i class="ph-bold ph-check-square-offset text-lg"></i> Cả lớp có mặt</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative z-10">
                        <div class="py-4 border-b border-slate-100 bg-slate-50 px-6 md:px-8 flex-shrink-0 flex justify-between items-center">
                            <div class="text-[11px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i class="ph-fill ph-users text-lg"></i> DANH SÁCH HỌC SINH - NGÀY ${formatDateForDisplay(currentAttendanceDate)}</div>
                        </div>
                        <div id="attendance-student-list" class="overflow-y-auto flex-1 custom-scrollbar">${tableRowsHtml || '<div class="p-16 text-center text-slate-400 font-medium text-lg">Chưa có dữ liệu học sinh. Vui lòng thêm học sinh trước.</div>'}</div>
                    </div>
                `;
            } 
            // --- TAB BẢNG THỐNG KÊ ---
            else {
                const allDates = Object.keys(state.attendanceRecords).sort((a,b) => new Date(a) - new Date(b));
                
                // Header của bảng thống kê
                const tableHeadDates = allDates.map(d => {
                    const p = d.split('-'); const formatted = `${p[2]}/${p[1]}`;
                    return `<th class="p-4 text-center border-l border-white/10 whitespace-nowrap text-white font-bold text-xs tracking-wider w-16">${formatted}</th>`;
                }).join('');

                // Dữ liệu các dòng
                const tableBodyRows = state.students.map((s, index) => {
                    let presentCount = 0, absentCount = 0;
                    const dateCells = allDates.map(d => {
                        const status = state.attendanceRecords[d][s.id]; 
                        let cellContent = '';
                        // Hiển thị trạng thái điểm danh dưới dạng chữ có badge tròn mờ
                        if (status === 'present') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center font-bold text-xs"><i class="ph-bold ph-check"></i></div>'; presentCount++; }
                        else if (status === 'late') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-yellow-50 text-yellow-500 flex items-center justify-center font-bold text-xs"><i class="ph-bold ph-clock"></i></div>'; presentCount++; }
                        else if (status === 'excused') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-blue-50 text-blue-500 flex items-center justify-center font-bold text-xs">P</div>'; absentCount++; }
                        else if (status === 'unexcused') { cellContent = '<div class="w-8 h-8 mx-auto rounded-full bg-red-50 text-red-500 flex items-center justify-center font-bold text-xs">KP</div>'; absentCount++; }
                        else { cellContent = '<div class="w-8 h-8 mx-auto text-slate-200 flex items-center justify-center">-</div>'; }
                        
                        return `<td class="p-2 text-center border-l border-slate-100">${cellContent}</td>`;
                    }).join('');

                    return `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors ${index % 2 !== 0 ? 'bg-slate-50/30' : 'bg-white'}">
                            <td class="p-4 text-center font-bold text-slate-400 text-xs">${index + 1}</td>
                            <td class="p-4 font-bold text-slate-800 whitespace-nowrap text-sm border-l border-slate-100">${s.name}</td>

                }).join('');

                contentHtml = `

                        <div class="flex bg-slate-50 p-1.5 rounded-xl w-full md:w-max">

                    ${contentHtml}

        function markAttendance(id, status) {
  // Lưu vị trí đang cuộn trong danh sách học sinh
  const list = document.getElementById("attendance-student-list");
  const scrollTop = list ? list.scrollTop : 0;

  if (state.attendanceRecords[currentAttendanceDate][id] === status) {
    delete state.attendanceRecords[currentAttendanceDate][id];
  } else {
    state.attendanceRecords[currentAttendanceDate][id] = status;
  }

  saveData();
  renderLayout();

  // Khôi phục vị trí cuộn sau khi giao diện được vẽ lại
  requestAnimationFrame(() => {
    const newList = document.getElementById("attendance-student-list");

    if (newList) {

        function initPickerCards() {
            const stage = document.getElementById('picker-stage');
            if (!stage) return;

                el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 transition-transform border border-slate-100 will-change-transform z-10`;
                el.style.width = '110px';

                // Color theme for avatar border
                const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
                const borderColor = colors[index % colors.length];

                if(pickTarget === 'student') {

                }

                el.innerHTML = `
                    <div class="rounded-full p-1" style="background: linear-gradient(135deg, ${borderColor} 0%, transparent 100%);">
                        ${avatarHtml}
                    </div>
                    <div class="text-xs font-black text-slate-800 text-center w-full truncate leading-tight pointer-events-none">${item.name}</div>
                `;
                
                stage.appendChild(el);

                // Initial random positions
                const stageWidth = stage.offsetWidth;
                const stageHeight = stage.offsetHeight;
                
                return {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * (stageWidth - 150),
                    y: (Math.random() - 0.5) * (stageHeight - 150),
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    radius: 50 + Math.random() * 200, // for spiral/planet
                    baseX: 0, baseY: 0 // offset
                };
            });
        }

        function animatePicker() {
            if(!pickerItems.length) return;
            const stage = document.getElementById('picker-stage');
            if (!stage) { cancelAnimationFrame(pickerAnimationId); return; }
            
            const stageWidth = stage.offsetWidth;
            const stageHeight = stage.offsetHeight;
            const time = performance.now() / 1000; // time in seconds

            pickerItems.forEach((item, i) => {
                // Tốc độ thay đổi dựa trên việc có đang Pick (quay số) hay không
                const speedMulti = isPicking ? 8 : 1; 

                if (pickerMode === 'chaos') {
                    item.x += Math.cos(item.angle) * item.speed * speedMulti;
                    item.y += Math.sin(item.angle) * item.speed * speedMulti;
                    // Bouncing off walls
                    const boundX = stageWidth/2 - 60;
                    const boundY = stageHeight/2 - 70;
                    if (item.x > boundX || item.x < -boundX) item.angle = Math.PI - item.angle;
                    if (item.y > boundY || item.y < -boundY) item.angle = -item.angle;
                    
                    // Add some random noise
                    item.angle += (Math.random() - 0.5) * 0.1 * speedMulti;
                } 
                else if (pickerMode === 'spiral') {
                    const t = time * item.speed * speedMulti + i;
                    const r = (Math.sin(time * 0.5) * 0.5 + 0.5) * 300 + 50; // Radius expands and contracts
                    item.x = Math.cos(t) * r;
                    item.y = Math.sin(t) * r;
                }
                else if (pickerMode === 'planet') {
                    // Center is sun, others orbit
                    const t = time * (item.speed/2) * speedMulti;
                    item.x = Math.cos(t + i) * item.radius;
                    item.y = Math.sin(t + i) * item.radius;
                }
                else if (pickerMode === 'wave') {
                    item.x += item.speed * speedMulti * 2;
                    if(item.x > stageWidth/2 + 60) item.x = -stageWidth/2 - 60; // wrap around
                    item.y = Math.sin(item.x / 100 + time * 5) * 150;
                }
                else if (pickerMode === 'bubbles') {
                    item.y -= item.speed * speedMulti * 2;
                    if(item.y < -stageHeight/2 - 70) item.y = stageHeight/2 + 70;
                    item.x = Math.sin(item.y / 50 + time * 3 + i) * 100 + item.baseX;
                }
                else if (pickerMode === 'figure8') {
                    const t = time * item.speed * speedMulti + i;
                    item.x = Math.sin(t) * (stageWidth/3);
                    item.y = Math.sin(t) * Math.cos(t) * (stageHeight/3);
                }

                // Keep within bounds roughly
                item.x = Math.max(-stageWidth/2 + 55, Math.min(stageWidth/2 - 55, item.x));
                item.y = Math.max(-stageHeight/2 + 65, Math.min(stageHeight/2 - 65, item.y));

                // Apply transform relative to center
                item.el.style.transform = `translate(calc(-50% + ${item.x}px), calc(-50% + ${item.y}px))`;
            });

            if(!isPicking || performance.now() < pickEndTime) {
                pickerAnimationId = requestAnimationFrame(animatePicker);
            }
        }

        let pickEndTime = 0;
        window.startPicking = function() {
            if(pickerItems.length === 0) return showToast("Chưa có danh sách!", "error");
            if(isPicking) return;

            let clickSynth = null;

            let soundInterval = setInterval(() => {
                if(clickSynth && Tone.context.state === 'running') clickSynth.triggerAttackRelease("G5", "32n", Tone.now());
            }, 150);

            pickEndTime = performance.now() + (pickerTime * 1000);

            setTimeout(() => {
                clearInterval(soundInterval);
                finishPick();
            }, pickerTime * 1000);
        }

                    const monday = new Date(dObj.getFullYear(), dObj.getMonth(), diff);
                    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
                    const f = (dt) => `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}`;

                };
                
                const allWeeksSet = new Set();
                state.students.forEach(s => {
                    if (s.history) s.history.forEach(h => { if (h.date) allWeeksSet.add(getWeekLabel(h.date)); });

                                const monthYear = `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;

                }

                `;
            } else if (currentReportTab === 'diem-hoc-ki') {
                const hkDataRowsHtml = sortedStudents.map((s, index) => {
                    let hk1Plus = 0, hk1Minus = 0;
                    let hk2Plus = 0, hk2Minus = 0;
                    if (s.history) {
                        s.history.forEach(h => {

                    const hk2Total = hk2Plus - hk2Minus;
                    const yearTotal = hk1Total + hk2Total;
                    return `

           } else if (state.settingsTab === 'tich-diem') {
                contentHtml = renderViewTichDiem(); // 
} else if (state.settingsTab === 'qua-tang') {

                                        ? `<div class="w-14 h-14 rounded-2xl overflow-hidden shadow-sm border border-white ring-2 ring-slate-50 flex-shrink-0 bg-white"><img src="${r.imageUrl}" class="w-full h-full object-contain p-1"></div>`

                                    </div>

                            <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl">

                                <button onclick="exportData()" class="w-full py-3.5 bg-blueAccent text-white font-bold rounded-xl shadow-md hover:bg-blue-600 transition-colors flex items-center justify-center gap-2"><i class="ph-bold ph-download-simple text-lg"></i> TẢI XUỐNG BẢN SAO LƯU</button>

        window.exportData = function() {
            const dataStr = JSON.stringify(state, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `ChuyenTauThanhXuan_Backup_${getTodayString()}.json`;

            let linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            showToast("Đã tải xuống bản sao lưu!", "success");
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (confirm("Cảnh báo: Dữ liệu hiện tại sẽ bị ghi đè hoàn toàn bởi dữ liệu từ file phục hồi. Bạn có chắc chắn muốn tiếp tục?")) {
                        state = { ...state, ...importedState };
                        applyStateDefaults();
                        saveData();
                        renderLayout();
                        showToast("Đã phục hồi dữ liệu thành công!", "success");
                    }
                } catch (error) {
                    showToast("File không hợp lệ hoặc bị lỗi!", "error");
                }
            };
            reader.readAsText(file);
            // Reset input so the same file can be selected again if needed
            event.target.value = '';
        };

        function saveSettings() { state.admin.className = document.getElementById('setting-classname').value; state.admin.name = document.getElementById('setting-gvcn').value; saveData(); renderLayout(); showToast("Đã lưu thông tin cài đặt", "success"); }

        window.handleRewardImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            compressImage(file, (dataUrl) => {
                const imgInput = document.getElementById('edit-reward-image');
                if(imgInput) imgInput.value = dataUrl;
                
                const previewContainer = document.getElementById('reward-image-preview');
                if(previewContainer) {
                    previewContainer.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-contain p-2">`;
                }
            }, 800, 0.8);
        };

        window.openEditRewardModal = function(id) {

                            <h3 class="font-black text-xl relative z-10 flex items-center gap-2"><i class="ph-fill ph-gift text-accent"></i> ${id ? 'SỬA QUÀ TẶNG' : 'THÊM QUÀ MỚI'}</h3>

window.saveStudentEdit = function() {
    // 1. Lấy dữ liệu từ các ô nhập liệu
    const nameInput = document.getElementById('edit-s-name').value.trim();
    if (!nameInput) {
        return showToast("Vui lòng nhập họ và tên học sinh!", "error");
    }

    // 2. Thu thập toàn bộ thông tin trên form
    const studentData = {
        name: nameInput,
        avatarUrl: document.getElementById('edit-s-avatar').value.trim(),
        gender: document.getElementById('edit-s-gender').value,
        group: document.getElementById('edit-s-group').value,
        dob: document.getElementById('edit-s-dob').value,
        boardingType: document.getElementById('edit-s-boarding').value,
        code: document.getElementById('edit-s-code').value,
        role: document.getElementById('edit-s-role').value.trim(),
        goal: document.getElementById('edit-s-goal').value.trim(),
        talent: document.getElementById('edit-s-talent').value.trim()
    };

    // 3. Xử lý Lưu (Cập nhật người cũ hoặc Thêm người mới)
    if (state.editingStudentId) {
        const index = state.students.findIndex(s => s.id === state.editingStudentId);
        if (index > -1) {
            state.students[index] = { ...state.students[index], ...studentData };
            showToast("Đã cập nhật hồ sơ học sinh thành công!", "success");
        }
    } else {
        const newId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;
        state.students.push({
            ...studentData,
            id: newId,
            points: 0,
            stars: 0,
            history: [],
            comment: ''
        });
        showToast("Đã thêm học sinh mới thành công!", "success");
    }

    // 4. Lưu dữ liệu, cập nhật giao diện và đóng form
    saveData();
    renderLayout();
    closeModal('edit-student-modal');
};

window.deleteStudent = function(id) {
    const studentIndex = state.students.findIndex(s => s.id === id);
    if (studentIndex === -1) return;
    
    const studentName = state.students[studentIndex].name;
    if (confirm(`Bạn có chắc chắn muốn xóa học sinh "${studentName}" khỏi danh sách không? Hành động này sẽ xóa luôn cả lịch sử thi đua của em ấy và không thể hoàn tác!`)) {
        
        state.students.splice(studentIndex, 1);
        
        if (state.attendanceRecords) {
            for (const date in state.attendanceRecords) {
                if (state.attendanceRecords[date][id]) {
                    delete state.attendanceRecords[date][id];
                }
            }
        }
        
        saveData();
        renderLayout();
        showToast(`Đã xóa triệt để ${studentName} khỏi hệ thống!`, "success");
    }
};

        function handleExcelUpload(e) {
  const file = e.target.files[0];

  if (!file) return;

  const fileName = file.name.toLowerCase();

  if (!fileName.endsWith(".xlsx") && !fileName.endsWith(".xls")) {
    return showToast("Vui lòng chọn file Excel .xlsx hoặc .xls", "error");
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    try {
      const data = new Uint8Array(event.target.result);

      const workbook = XLSX.read(data, {
        type: "array"
      });

      const sheetName = "HOC_SINH";
      const worksheet = workbook.Sheets[sheetName];

      if (!worksheet) {
        return showToast(
          `Không tìm thấy sheet "${sheetName}". Kiểm tra lại tên sheet trong Excel.`,
          "error"
        );
      }

      const rows = XLSX.utils.sheet_to_json(worksheet, {
        header: 1,
        defval: ""
      });
      const scoreSheet = workbook.Sheets["BANG_DIEM_WEB"];
      const scoreRows = scoreSheet ? XLSX.utils.sheet_to_json(scoreSheet, { header: 1, defval: "" }) : [];
      const commentSheet = workbook.Sheets["NHAN_XET"];
      const commentRows = commentSheet ? XLSX.utils.sheet_to_json(commentSheet, { header: 1, defval: "" }) : [];
      processImportRows(rows, scoreRows, commentRows);
    } catch (error) {
      console.error(error);
      showToast("Không thể đọc file Excel. Hãy kiểm tra lại định dạng file.", "error");
    }
  };

  reader.readAsArrayBuffer(file);

  // Cho phép chọn lại chính file này nếu cần
  e.target.value = "";
}

        function processPastedData() {
            const text = document.getElementById('import-paste-area').value.trim();
            if (!text) return showToast("Vui lòng dán dữ liệu!", "error");
            processImportRows(text.split('\n').map(row => row.split('\t')));
        }

        function processImportRows(rows, scoreRows = [], commentRows = []) {
  if (!rows || rows.length < 2) {
    return showToast("File Excel chưa có dữ liệu học sinh!", "error");
  }

  const headers = rows[0].map(h =>
    String(h || "").trim().toLowerCase().replace(/\s+/g, "")
  );

  const idIndex = headers.indexOf("mahs");
  const nameIndex = headers.indexOf("hoten");
  const phoneIndex = headers.indexOf("sdt_phhs");
  const blockIndex = headers.indexOf("khốithi");
  const goalIndex = headers.indexOf("tổngđiểmmụctiêu");

  if (idIndex === -1 || nameIndex === -1 || phoneIndex === -1) {
    return showToast(
      "Sheet HOC_SINH phải có cột: MaHS, HoTen, SDT_PHHS",
      "error"
    );
  }

  const importedStudents = [];
  const usedIds = new Set();
  const usedPhones = new Set();

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];

    const studentCode = String(row[idIndex] || "").trim();
    const name = String(row[nameIndex] || "").trim();
    const phone = String(row[phoneIndex] || "")
      .replace(/\D/g, "")
      .trim();

    // Bỏ qua dòng trống
    if (!studentCode && !name && !phone) continue;

    if (!studentCode || !name || !phone) {
      return showToast(`Dòng ${i + 1}: thiếu MaHS, HoTen hoặc SDT_PHHS`, "error");
    }

    if (usedIds.has(studentCode)) {
      return showToast(`Dòng ${i + 1}: MaHS "${studentCode}" bị trùng`, "error");
    }

    if (usedPhones.has(phone)) {
      return showToast(`Dòng ${i + 1}: SĐT PHHS "${phone}" bị trùng`, "error");
    }

    usedIds.add(studentCode);
    usedPhones.add(phone);

    importedStudents.push({
      id: importedStudents.length + 1,
      studentCode: studentCode,
      name: name,
      parentPhone: phone,
      khoiThi: blockIndex > -1 ? String(row[blockIndex] || "").trim() : "",
      tongDiemMucTieu: goalIndex > -1 ? String(row[goalIndex] || "").trim() : "",
      comment: "",

      // Giữ giá trị mặc định để các màn hình cũ chưa bị lỗi.
      points: 0,
      stars: 0,
      group: "",
      role: "",
      talent: "",
      avatarUrl: "",
      gender: "",
      history: []
    });
  }

  if (!importedStudents.length) {
    return showToast("Không tìm thấy học sinh hợp lệ trong Excel!", "error");
  }
  const subjectMap = { TOAN: "Toán", VAN: "Văn", ANH: "Anh", LY: "Lý", HOA: "Hoá", SINH: "Sinh" };
  const scoreData = [];
  if (scoreRows.length >= 6) {
    const codes = scoreRows[2] || [], labels = scoreRows[3] || [], dates = scoreRows[4] || [];
    for (let c = 2; c < codes.length; c++) {
      const m = String(codes[c] || "").trim().match(/^(TOAN|VAN|ANH|LY|HOA|SINH)_BAI_\d+$/);
      if (!m || !String(labels[c] || "").trim()) continue;
      for (let r = 5; r < scoreRows.length; r++) {
        const code = String(scoreRows[r][0] || "").trim();
        const score = Number(scoreRows[r][c]);
        if (!code || !Number.isFinite(score)) continue;
        scoreData.push({ studentCode: code, subject: subjectMap[m[1]], title: String(labels[c]).trim(), date: String(dates[c] || "").trim(), score });
      }
    }
  }

  // Sheet NHAN_XET: MaHS | HoTen | TUAN_01 | TUAN_02 | ...
  // Chỉ lưu các ô có nội dung; tuần nào để trống sẽ tự được bỏ qua.
  const teacherComments = [];
  if (commentRows.length >= 2) {
    const weekColumns = (commentRows[0] || []).map((header, index) => {
      const match = String(header || "").trim().toUpperCase().match(/^TUAN_(\d+)$/);
      return match ? { index, week: "TUAN_" + match[1], weekNumber: Number(match[1]) } : null;
    }).filter(Boolean);
    for (let r = 1; r < commentRows.length; r++) {
      const code = String(commentRows[r][0] || "").trim();
      if (!code) continue;
      weekColumns.forEach(({ index, week, weekNumber }) => {
        const commentText = String(commentRows[r][index] || "").trim();
        if (commentText) teacherComments.push({ studentCode: code, week, weekNumber, text: commentText });
      });
    }
  }

  if (!confirm(`Bạn muốn cập nhật danh sách ${importedStudents.length} học sinh từ Excel?`)) {
    return;
  }

  state.students = importedStudents;
  state.scores = scoreData;
  state.teacherComments = teacherComments;
  saveData();
  renderLayout();

  showToast("Đã nhập " + importedStudents.length + " học sinh, " + scoreData.length + " đầu điểm và " + teacherComments.length + " nhận xét!", "success");
}

        function showRandomResultModal(title, htmlContent) {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="random-result-modal">
                    <div class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden"><canvas id="modal-confetti-canvas" class="w-full h-full"></canvas></div>
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col relative text-center pt-10 pb-12 px-6 z-10 animate-[popIn_0.5s_cubic-bezier(0.16,1,0.3,1)_forwards]">
                        <button onclick="closeModal('random-result-modal')" class="absolute top-6 right-6 text-slate-400 hover:bg-slate-200 rounded-full p-2 transition-colors z-20"><i class="ph-bold ph-x text-xl"></i></button>
                        <div class="inline-block px-4 py-1.5 rounded-full bg-accent/10 border border-accent/20 text-accent font-black text-xs uppercase tracking-widest mx-auto mb-4">Kết quả lựa chọn</div>

                        <div class="flex flex-wrap justify-center gap-8 px-4 max-h-[60vh] overflow-y-auto custom-scrollbar">${htmlContent}</div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const canvas = document.getElementById('modal-confetti-canvas'); if (!canvas) return;
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d');
                const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
                for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+3, dx: Math.random()*16-8, dy: Math.random()*-15-8, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
                function render() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                    particles.forEach(p => {
                        if (p.y < canvas.height) active++;
                        p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.25;
                        ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke();
                    });
                    if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
                } render();
            }, 100);
        }
