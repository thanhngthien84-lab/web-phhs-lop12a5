<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THANH XUÂN</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Quicksand"', 'sans-serif'],
                    },
                    colors: { 
                        primary: '#1e1b4b',
                        secondary: '#312e81', 
                        accent: '#f59e0b',
                        blueAccent: '#3b82f6', 
                        lightBg: '#f8fafc', 
                        cardBg: '#ffffff' 
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'spin-slow': 'spin 8s linear infinite',
                        'bounce-slight': 'bounceSlight 2s infinite ease-in-out'
                    },
                    keyframes: { 
                        fadeIn: { 
                            '0%': { opacity: '0', transform: 'translateY(15px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' }, 
                            '100%': { opacity: '1', transform: 'translateY(0)' } 
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        }
                    },
                    letterSpacing: {
                        tighter: '-0.04em',
                        tight: '-0.02em',
                        normal: '0',
                        wide: '0.02em',
                        wider: '0.05em',
                        widest: '0.1em',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9; 
            color: #0f172a; 
            margin: 0; 
            height: 100dvh; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .toast { 
            position: fixed; bottom: 24px; right: 24px; 
            padding: 16px 24px; border-radius: 16px; 
            color: white; font-weight: 700; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            display: flex; align-items: center; gap: 12px; 
            z-index: 1000; 
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .toast.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast.error { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .toast.fadeOut { animation: fadeOutRight 0.3s ease-in forwards; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        h1, h2, h3, h4, h5, h6 { letter-spacing: -0.02em; }
        .tracking-widest { letter-spacing: 0.1em; }

        .bg-banner { position: relative; overflow: hidden; }
        .bg-banner::before { 
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); 
            animation: spin 40s linear infinite; pointer-events: none; 
        }
        
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-dark { background: rgba(30, 27, 75, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        @media print {
            body * { visibility: hidden; }
            #report-container, #report-container * { visibility: visible; }
            #report-container { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; }
            .custom-scrollbar { overflow: visible !important; max-height: none !important; }
            .print\:hidden { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="app" class="flex h-screen w-full bg-slate-100"></div>
    <div id="toast-container"></div>
    <div id="timer-drawer-container"></div>

    <script>
        // CẤU HÌNH SAAS & QUẢN LÝ SHEET THEO GIÁO VIÊN
        const urlParams = new URLSearchParams(window.location.search);
        const currentSheetId = urlParams.get('sheetId') || '';

        window.googleSpreadsheetUrl = currentSheetId 
            ? `https://docs.google.com/spreadsheets/d/${currentSheetId}/edit` 
            : (window.googleSpreadsheetUrl || "");

        const BASE_GOOGLE_API = "https://script.google.com/macros/s/AKfycbwKehnwOgmJGgSMMJiT10bDKZhc58nAKRnjOvoDCe7jvNGKJlnnpJhIUgYsWx8BJcFgDw/exec";
        const GOOGLE_SHEET_API_URL = currentSheetId 
            ? `${BASE_GOOGLE_API}?sheetId=${encodeURIComponent(currentSheetId)}` 
            : BASE_GOOGLE_API;

        let state = {
            currentTab: 'tong-quan',
            auth: { loggedIn: true, role: 'gvcn' }, 
            theme: { month: "CHỦ ĐIỂM THÁNG", title: "CHUYẾN TÀU THANH XUÂN", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" },
            admin: { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP HỌC", classAvatarUrl: "" },
            tasks: [], 
            journeys: [],
            settings: { sidebarPosition: 'left', deductStarsOnRedeem: true },
            settingsTab: 'thong-tin',
            students: [],
            groups: [
                { id: "g1", name: "Tổ 1", color: "text-red-500", avatarUrl: "" },
                { id: "g2", name: "Tổ 2", color: "text-green-500", avatarUrl: "" },
                { id: "g3", name: "Tổ 3", color: "text-yellow-500", avatarUrl: "" },
                { id: "g4", name: "Tổ 4", color: "text-blueAccent", avatarUrl: "" }
            ],
            rewards: [],
            attendanceRecords: {},
            scores: [],
            teacherComments: [],
            scoreBook: { tests: [], students: [], selectedSubject: 'TOAN', selectedTestCode: '', draftTest: null, loaded: false, loading: false, updatedAt: '' },
            attendanceTab: 'diem-danh',
            pointsForm: {
                actionType: 'add',
                targetType: 'student',
                selectedTargetId: '',
                pointsVal: 0,
                category: 'Học tập',
                reason: '',
                note: ''
            },
            selectedStudentForRewards: null,
            editingStudentId: null,
            editingGroupId: null,
            criteria: null
        };

        window.addEventListener("beforeunload", function(event) {
            if (window.hwUI && (window.hwUI.dirty || window.hwUI.busy)) { event.preventDefault(); event.returnValue = ""; }
        });

        let timerInterval = null;
        let timerSeconds = 0;
        let isTimerRunning = false;
        let isDataLoaded = false;

        const _d = new Date();
        let currentAttendanceDate = `${_d.getFullYear()}-${String(_d.getMonth() + 1).padStart(2, '0')}-${String(_d.getDate()).padStart(2, '0')}`;
        
        window.formatDateForDisplay = function(dStr) { 
            if(!dStr) return '';
            return dStr.split('-').reverse().join('/'); 
        };

        window.getTodayString = function() {
            const date = new Date();
            return `${String(date.getDate()).padStart(2, '0')}${String(date.getMonth() + 1).padStart(2, '0')}${date.getFullYear()}`;
        };

        const menuItems = [
            { id: 'tong-quan', icon: 'ph-squares-four', label: 'Trang chủ' },
            { id: 'hoc-sinh', icon: 'ph-users', label: 'Học sinh' },
            { id: 'diem-hoc-tap', icon: 'ph-chart-line-up', label: 'Điểm học tập' },
            { id: 'thoi-khoa-bieu', icon: 'ph-calendar-list', label: 'Thời khóa biểu' },
            { id: 'so-do-lop', icon: 'ph-grid-four', label: 'Sơ đồ lớp' },
            { id: 'doi-qua', icon: 'ph-gift', label: 'Quà tặng' },
            { id: 'nhom-thi-dua', icon: 'ph-flag-pennant', label: 'Tổ thi đua' },
            { id: 'diem-danh', icon: 'ph-calendar-check', label: 'Điểm danh' },
            { id: 'vong-quay', icon: 'ph-cards', label: 'Gọi Tên Ngẫu Nhiên' },
            { id: 'dong-ho', icon: 'ph-timer', label: 'Công cụ' },
            { id: 'lich-bao-giang', icon: 'ph-notebook', label: 'Lịch báo giảng' },
            { id: 'xep-hang', icon: 'ph-trophy', label: 'Tuyên Dương' },
            { id: 'bao-cao', icon: 'ph-chart-bar', label: 'Sổ theo dõi' },
            { id: 'tram-dong-hanh', icon: 'ph-hands-clapping', label: 'Trạm đồng hành' },
            { id: 'cai-dat', icon: 'ph-gear', label: 'Cài đặt' }
        ];

        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }
        function escapeHtmlText(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        function toInlineJsValue(value) {
            return typeof value === 'number' && Number.isFinite(value)
                ? String(value)
                : `'${escapeInlineJs(String(value ?? ''))}'`;
        }
        
        function generateUniqueCode() {
            let code, attempts = 0;
            const currentStudents = state.students || [];
            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (currentStudents.some(s => s.code === code) && attempts < 100);
            return code;
        }

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applyStateDefaults() {
            if (!state.theme) state.theme = { month: "CHỦ ĐIỂM THÁNG 9", title: "CHÀO MỪNG NĂM HỌC MỚI", bannerUrl: "", bannerColorClass: "from-[#1e1b4b] to-[#312e81]" };
            if (!state.theme.bannerColorClass) state.theme.bannerColorClass = "from-[#1e1b4b] to-[#312e81]";
            if (state.theme.teacherMsgTitle === "CÔ THÙY NHẮN") state.theme.teacherMsgTitle = "Thầy/cô muốn gửi gắm";
            if (state.theme.teacherMsgSign === "Cô Đỗ Thị Thùy") state.theme.teacherMsgSign = "";
            if (!state.admin) state.admin = { name: "Giáo Viên", role: "Giáo viên chủ nhiệm", avatarUrl: "", className: "LỚP HỌC", classAvatarUrl: "" };
            if (!state.settings) state.settings = { sidebarPosition: 'left', deductStarsOnRedeem: true };
            if (!state.attendanceRecords) state.attendanceRecords = {};
            if (!state.scores) state.scores = [];
            if (!state.teacherComments) state.teacherComments = [];
            if (!state.scoreBook) state.scoreBook = { tests: [], students: [], selectedSubject: 'TOAN', selectedTestCode: '', draftTest: null, loaded: false, loading: false, updatedAt: '' };
            if (!Array.isArray(state.scoreBook.tests)) state.scoreBook.tests = [];
            if (!Array.isArray(state.scoreBook.students)) state.scoreBook.students = [];
            if (!state.scoreBook.selectedSubject) state.scoreBook.selectedSubject = 'TOAN';
            if (!state.attendanceTab) state.attendanceTab = 'diem-danh';
            if (!state.students) state.students = [];
            if (!state.timetable) state.timetable = { dayUrl: '', extraUrl: '' };
            if (!state.tasks) state.tasks = [];
            if (!state.journeys) state.journeys = [];
            const defaultRewards = [
                { id: 'r1', name: 'Đổi chỗ ngồi 1 ngày', cost: 10, icon: 'ph-seat', color: 'text-purple-600', bg: 'bg-purple-100', desc: 'Chọn chỗ ngồi yêu thích' },
                { id: 'r2', name: 'Nhạc theo yêu cầu', cost: 20, icon: 'ph-music-notes', color: 'text-blueAccent', bg: 'bg-blue-100', desc: 'Bật bài hát yêu thích giờ ra chơi' },
                { id: 'r3', name: 'Miễn làm bài tập', cost: 50, icon: 'ph-files', color: 'text-emerald-600', bg: 'bg-emerald-100', desc: 'Miễn 1 bài tập về nhà' },
                { id: 'r4', name: 'Quà tặng bí mật', cost: 100, icon: 'ph-gift', color: 'text-orange-600', bg: 'bg-orange-100', desc: 'Nhận phần quà đặc biệt từ GV' }
            ];
            if (!state.rewards || state.rewards.length === 0) state.rewards = defaultRewards;

            state.students.forEach(s => { 
                if (typeof s.stars === 'undefined') s.stars = s.points; 
                if (!s.code) s.code = generateUniqueCode();
                if (!s.history) s.history = [];
            });

            const defaultCriteria = {
                version: 2,
                positive: [
                    { points: 5, reason: "Đạt điểm 9,10", category: "Học tập" }, 
                    { points: 3, reason: "Giúp đỡ bạn bè", category: "Phong trào" }, 
                    { points: 10, reason: "Làm bài tập đầy đủ", category: "Học tập" }, 
                    { points: 10, reason: "Đóng góp phong trào", category: "Phong trào" }, 
                    { points: 15, reason: "Điểm cao kiểm tra", category: "Học tập" }, 
                    { points: 2, reason: "Đi học đúng giờ", category: "Chuyên cần" },
                    { points: 5, reason: "Trực nhật xuất sắc", category: "Nề nếp" }
                ],
                negative: [
                    { points: 5, reason: "Nói chuyện riêng", category: "Kỷ luật" }, 
                    { points: 10, reason: "Không làm bài tập", category: "Học tập" }, 
                    { points: 3, reason: "Quên đồ dùng học tập", category: "Học tập" }, 
                    { points: 3, reason: "Ăn vặt trong lớp", category: "Kỷ luật" }, 
                    { points: 2, reason: "Đi học muộn", category: "Chuyên cần" },
                    { points: 5, reason: "Mất trật tự trong giờ", category: "Kỷ luật" },
                    { points: 15, reason: "Sử dụng điện thoại", category: "Kỷ luật" }
                ]
            };
            if (!state.criteria || state.criteria.version !== 2) state.criteria = defaultCriteria;
            state.criteria.positive.forEach(c => { if(!c.category) c.category = "Khác"; });
            state.criteria.negative.forEach(c => { if(!c.category) c.category = "Khác"; });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `<i class="ph-fill ph-check-circle text-2xl drop-shadow"></i> <span>${message}</span>` : `<i class="ph-fill ph-warning-circle text-2xl drop-shadow"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('fadeOut'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function getAvatarImg(url, name, classes = "w-10 h-10") {
            const safeName = name || 'User'; const seed = encodeURIComponent(safeName);
            const finalUrl = url || `https://api.dicebear.com/7.x/notionists/svg?seed=${seed}&backgroundColor=e0e7ff,fef08a,dcfce7,fee2e2`;
            return `<img src="${finalUrl}" class="${classes} rounded-full object-cover flex-shrink-0 border-2 border-white shadow-sm">`;
        }

        window.switchSettingsTab = function(tab) {
            state.settingsTab = tab;
            renderLayout();
        };

        window.switchTab = function(tabId) {
            if (window.hwUI && window.hwUI.busy) return;
            if (window.hwUI && window.hwUI.dirty) {
                if (!confirm('BTVN chưa lưu. Bạn muốn rời trang và bỏ phần đang sửa?')) return;
                prepareHomeworkDraft();
            } 
            if (state.auth && state.auth.role === 'bancansu') {
                const allowed = ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'diem-danh'];
                if (!allowed.includes(tabId)) {
                    showToast("Ban cán sự chỉ có quyền truy cập Trang chủ, Học sinh, Thời khóa biểu và Điểm danh!", "error");
                    return;
                }
            }
            if (state.auth && state.auth.role === 'bgh') {
                const allowed = ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh'];
                if (!allowed.includes(tabId)) {
                    showToast("Ban giám hiệu chỉ có quyền truy cập Trang chủ, Học sinh, TKB, Sơ đồ, Điểm danh, Sổ theo dõi và Trạm đồng hành!", "error");
                    return;
                }
            }
            if (tabId === 'cai-dat') {
                state.settingsTab = 'thong-tin';
            }
            state.currentTab = tabId; 
            renderLayout();
            if (tabId === 'diem-hoc-tap' && window.learningSection !== 'homework') {
                setTimeout(function() { loadScoreBookFromGoogle({ silent: true }); }, 0);
            }
        };

        function renderSidebar() {
            let activeMenuItems = menuItems;
            if (state.auth && state.auth.role === 'bancansu') {
                activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'diem-danh'].includes(item.id));
            } else if (state.auth && state.auth.role === 'bgh') {
                activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh'].includes(item.id));
            }

            const menuHtml = activeMenuItems.map(item => {
                if (item.id === 'dong-ho') {
                    return `<button onclick="openTimerDrawer()" class="w-full flex items-center gap-4 px-6 py-3.5 mb-2 rounded-2xl transition-all duration-300 text-indigo-200 hover:bg-white/10 hover:text-white font-semibold group"><div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/20 transition-colors"><i class="ph-fill ${item.icon} text-xl"></i></div><span class="text-sm tracking-wide">${item.label}</span></button>`;
                }
                const isActive = state.currentTab === item.id;
                return `
                    <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-4 px-6 py-3.5 mb-2 rounded-2xl transition-all duration-300 group relative overflow-hidden ${isActive ? 'text-white' : 'text-indigo-200 hover:text-white hover:bg-white/5'}">
                        ${isActive ? '<div class="absolute inset-0 bg-gradient-to-r from-blueAccent to-indigo-600 opacity-90"></div><div class="absolute inset-0 bg-[url(\'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNykiLz48L3N2Zz4=\')]"></div>' : ''}
                        <div class="relative z-10 flex items-center gap-4 w-full">
                            <div class="p-2 rounded-xl ${isActive ? 'bg-white/20 shadow-inner' : 'bg-transparent group-hover:bg-white/10'} transition-colors"><i class="ph-fill ${item.icon} text-xl"></i></div>
                            <span class="text-sm tracking-wide font-bold">${item.label}</span>
                        </div>
                    </button>`;
            }).join('');
            
            const classAvatarContent = state.admin.classAvatarUrl ? `<img src="${state.admin.classAvatarUrl}" class="w-full h-full object-cover">` : `<i class="ph-fill ph-student text-white text-3xl"></i>`;
            
            return `
                <aside class="hidden md:flex w-[280px] bg-primary text-white flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.05)] z-20 flex-shrink-0 print:hidden relative border-r border-white/10">
                    <div class="flex flex-col items-center justify-center p-8 pb-6 relative overflow-hidden">
                        <div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                        <div class="relative group cursor-pointer mb-5 z-10" onclick="document.getElementById('class-avatar-upload').click()" title="Thay đổi ảnh đại diện">
                            <div class="w-20 h-20 bg-gradient-to-tr from-blueAccent to-purple-500 rounded-3xl flex items-center justify-center shadow-lg border-2 border-white/20 transform group-hover:scale-105 transition-all overflow-hidden relative group-hover:shadow-blueAccent/50">
                                ${classAvatarContent}
                                <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph-fill ph-camera text-white text-xl"></i></div>
                            </div>
                        </div>

        function renderViewTongQuan() {

            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            });

            const presentStudents = totalStudents - absentCount;

            let learningPercent = 100;
            if (totalStudents > 0) {
                const positiveStudents = state.students.filter(s => (s.points || 0) >= 0).length;
                learningPercent = Math.round((positiveStudents / totalStudents) * 100);
            }
        
            const negativeStudentsCount = state.students.filter(s => (s.points || 0) < 0).length;
            const totalIssues = absentCount + negativeStudentsCount;

            let disciplineColor = "text-emerald-500";
            let disciplineIcon = "🟢";

                    disciplineColor = "text-red-500";
                    disciplineIcon = "🔴";

                            <span class="font-black tracking-widest text-sm md:text-base">${new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>

                    <div>
                        <div class="w-full h-40 md:h-56 bg-gradient-to-br ${state.theme.bannerColorClass} rounded-[2rem] shadow-sm relative flex flex-col items-center justify-center group overflow-hidden">
                            <div class="text-white/80 text-[11px] font-bold uppercase tracking-[0.25em] mb-3 z-10">${state.theme.month}</div>
                            <h1 class="text-white text-3xl md:text-5xl font-black uppercase tracking-tight text-center px-4 z-10 drop-shadow-md">${state.theme.title}</h1>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-4 uppercase tracking-wide">
                            📊 TÌNH HÌNH LỚP HÔM NAY
                        </h3>
                        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">👨‍🎓 SĨ SỐ</div>
                                <div class="text-3xl font-black text-slate-800 mt-auto">${presentStudents}<span class="text-lg text-slate-400">/${totalStudents}</span></div>
                            </div>
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">📚 HỌC TẬP</div>
                                <div class="text-3xl font-black text-blueAccent mt-auto">${learningPercent}%</div>
                            </div>
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">${disciplineIcon} NỀN NẾP</div>
                                <div class="text-2xl font-black ${disciplineColor} mt-auto">${disciplineStatus}</div>
                            </div>
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">⭐ ĐIỂM TỐT</div>

        function renderViewHocSinh() {
            const studentsHtml = state.students.map(s => `
                <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200 flex flex-col items-center relative hover:shadow-xl transition-all">
                    ${getAvatarImg(s.avatarUrl, s.name, "w-24 h-24 mb-4 ring-4 ring-slate-50 shadow-md")}

                    <div class="text-3xl font-black text-primary mb-4">${s.points || 0} đ</div>
                    <button onclick="openEditStudentModal(${toInlineJsValue(s.id)})" class="w-full py-2.5 bg-slate-50 text-slate-600 font-bold rounded-xl text-xs hover:bg-slate-100 transition-colors border border-slate-200">

                        <div>

                        </div>
                        <div class="flex gap-3">

                                <i class="ph-bold ph-arrows-clockwise text-lg"></i> Đồng bộ từ Sheet
                            </button>
                            <button onclick="openConnectedGoogleSheet()" class="px-5 py-2.5 bg-blue-50 text-blue-700 font-bold rounded-xl border border-blue-200 hover:bg-blue-100 flex items-center gap-2 text-sm shadow-sm transition-all">
                                <i class="ph-bold ph-table text-lg"></i> Mở Google Sheet
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
                        ${studentsHtml || '<div class="col-span-full py-16 text-center text-slate-400">Chưa có học sinh nào. Bấm "Đồng bộ từ Sheet" để tải dữ liệu.</div>'}
                    </div>
                </div>
            `;
        }

        // CÁC HÀM GỌI API ĐỒNG BỘ ĐÃ ĐƯỢC CHUẨN HÓA THAM SỐ
        function homeworkRequest(mode, params) {
            return new Promise((resolve, reject) => {
                const callback = "hw_" + Date.now() + "_" + Math.floor(Math.random() * 1e8);
                const script = document.createElement("script");
                let finished = false;
                const timer = setTimeout(() => finish(null), 35000);

                function finish(r) {
                    if (finished) return;
                    finished = true; clearTimeout(timer); script.remove();
                    window[callback] = () => {}; setTimeout(() => delete window[callback], 60000);
                    if (!r || !r.ok) {
                        reject(new Error(r && r.message || "Chưa xác nhận được kết quả từ Sheet."));
                        return;
                    }
                    resolve(r);
                }

                window[callback] = finish;
                script.onerror = () => finish(null);
                const sep = GOOGLE_SHEET_API_URL.includes('?') ? '&' : '?';
                script.src = GOOGLE_SHEET_API_URL + sep + new URLSearchParams({ mode, ...params, callback });
                document.head.appendChild(script);
            });
        }

        function requestScoreBookGoogle(mode, params) {
            return new Promise(function(resolve, reject) {
                const callbackName = "googleScoreBookCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                const script = document.createElement("script");
                let finished = false;
                const timeout = setTimeout(function() { finish({ ok: false, message: "Hệ thống phản hồi chậm." }); }, 30000);

                function cleanup() { clearTimeout(timeout); delete window[callbackName]; script.remove(); }
                function finish(response) {
                    if (finished) return;
                    finished = true; cleanup();
                    if (!response || !response.ok || !response.scoreBook) {
                        if (response && response.message === "Mã quản trị không chính xác.") clearGoogleAdminKey();
                        reject(new Error((response && response.message) || "Không thể xử lý dữ liệu điểm."));
                        return;
                    }
                    resolve(response);
                }

                window[callbackName] = finish;
                script.onerror = function() { finish({ ok: false, message: "Không thể kết nối Google Sheet." }); };
                const query = Object.keys(params || {}).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
                const sep = GOOGLE_SHEET_API_URL.includes('?') ? '&' : '?';
                script.src = GOOGLE_SHEET_API_URL + sep + "mode=" + encodeURIComponent(mode) + (query ? "&" + query : "") + "&callback=" + callbackName;
                document.head.appendChild(script);
            });
        }

        function requestParentDataFromGoogle(phone) {
            return new Promise((resolve, reject) => {
                const callbackName = "googleParentCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                const script = document.createElement("script");
                let finished = false;
                const timeout = setTimeout(() => finish({ ok: false, message: "Hệ thống phản hồi chậm." }), 30000);

                function cleanup() { clearTimeout(timeout); delete window[callbackName]; script.remove(); }
                function finish(response) {
                    if (finished) return;
                    finished = true; cleanup();
                    if (!response || !response.ok || !response.student) {
                        reject(new Error((response && response.message) || "Không tìm thấy học sinh."));
                        return;
                    }
                    resolve(response);
                }

                window[callbackName] = finish;
                script.onerror = () => finish({ ok: false, message: "Kết nối tới cổng tra cứu bị gián đoạn." });
                const sep = GOOGLE_SHEET_API_URL.includes('?') ? '&' : '?';
                script.src = GOOGLE_SHEET_API_URL + sep + "lookupCode=" + encodeURIComponent(phone) + "&callback=" + callbackName;
                document.head.appendChild(script);
            });
        }

        window.openConnectedGoogleSheet = function() {
            if (!window.googleSpreadsheetUrl) {
                showToast("Chưa nhận được đường dẫn Sheet của lớp!", "error");
                return;
            }
            window.open(window.googleSpreadsheetUrl, "_blank", "noopener,noreferrer");
        };

        function rememberGoogleAdminKey(key) {
            window.googleAdminKey = String(key || "");
            try { sessionStorage.setItem("chuyen_tau_google_admin_key", window.googleAdminKey); } catch (e) {}
        }

        function clearGoogleAdminKey() { rememberGoogleAdminKey(""); }

        function getGoogleAdminKey() {
            if (window.googleAdminKey) return window.googleAdminKey;
            try {
                const saved = sessionStorage.getItem("chuyen_tau_google_admin_key");
                if (saved) { window.googleAdminKey = saved; return saved; }
            } catch (e) {}
            const key = window.prompt("Nhập mã quản trị GVCN để đồng bộ:");
            if (!key) return "";
            rememberGoogleAdminKey(key);
            return key;
        }

        window.syncClassFromGoogle = function() {
            const adminKey = getGoogleAdminKey();
            if (!adminKey) return;

            showToast("Đang đồng bộ danh sách học sinh...", "success");
            const callbackName = "googleClassCallback_" + Date.now();
            const script = document.createElement("script");
            const timeout = setTimeout(() => finish({ ok: false, message: "Không thể kết nối nguồn dữ liệu." }), 15000);

            function cleanup() { clearTimeout(timeout); delete window[callbackName]; script.remove(); }
            function finish(response) {
                cleanup();
                if (!response || !response.ok || !Array.isArray(response.students)) {
                    return showToast((response && response.message) || "Không thể đồng bộ danh sách.", "error");
                }
                state.students = response.students.map(s => ({
                    id: s.studentCode,
                    studentCode: s.studentCode,
                    name: s.name,
                    parentPhone: s.parentPhone,
                    lookupCode: s.lookupCode,
                    points: 0,
                    stars: 0
                }));
                saveData();
                renderLayout();
                showToast("Đã đồng bộ thành công " + state.students.length + " học sinh!", "success");
            }

            window[callbackName] = finish;
            script.onerror = () => finish({ ok: false, message: "Không thể kết nối nguồn dữ liệu." });
            const sep = GOOGLE_SHEET_API_URL.includes('?') ? '&' : '?';
            script.src = GOOGLE_SHEET_API_URL + sep + "mode=class&adminKey=" + encodeURIComponent(adminKey) + "&callback=" + callbackName;
            document.head.appendChild(script);
        };

        function saveData() {
            try {
                const storeKey = currentSheetId ? `class_data_${currentSheetId}` : 'class_data_default';
                localStorage.setItem(storeKey, JSON.stringify(state));
            } catch (e) {
                console.warn("Không thể lưu LocalStorage:", e);
            }
        }

        function loadData() {
            try {
                const storeKey = currentSheetId ? `class_data_${currentSheetId}` : 'class_data_default';
                const saved = localStorage.getItem(storeKey);
                if (saved) state = { ...state, ...JSON.parse(saved) };
            } catch (e) {}
            applyStateDefaults();
        }

        // KHỞI ĐỘNG HỆ THỐNG
        loadData();
        renderLayout();
    </script>
