        }
        
        function markAttendance(id, status) {
            const list = document.getElementById("attendance-student-list");
            const scrollTop = list ? list.scrollTop : 0;
            const selectedDate = String(currentAttendanceDate);
            const dayRecord = state.attendanceRecords[selectedDate];
            const previousStatus = dayRecord[id] || "";
            const nextStatus = previousStatus === status ? "" : status;

            if (nextStatus) dayRecord[id] = nextStatus;
            else delete dayRecord[id];

            markAttendanceDateDirty(selectedDate);
            saveData();
            renderLayout();

            requestAnimationFrame(() => {
                const newList = document.getElementById("attendance-student-list");
                if (newList) newList.scrollTop = scrollTop;
            });

            const student = state.students.find(item => String(item.id) === String(id));
            if (student && student.studentCode) {
                scheduleAttendanceAutoSave(selectedDate);
            }
        }

        function markAllPresent() {
            const selectedDate = String(currentAttendanceDate);
            state.attendanceRecords[selectedDate] = {};

            state.students.forEach(student => {
                state.attendanceRecords[selectedDate][student.id] = "present";
            });

            markAttendanceDateDirty(selectedDate);
            saveData();
            renderLayout();
            scheduleAttendanceAutoSave(selectedDate, 100);
            showToast("Đã đánh dấu cả lớp có mặt. Hệ thống đang lưu lên Sheet...", "success");
        }

        function changeAttendanceDate(date) {
            if (!date) return;
            currentAttendanceDate = date;
            renderLayout();
        }

        let pickerMode = 'chaos';
        let pickerBg = 'default';
        let pickerTime = 3;
        let pickerItems = [];
        let isPicking = false;
        let pickerAnimationId = null;
        let pickTarget = 'student';

        function renderViewVongQuay() {
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            
            let stageBgClass = 'bg-slate-50';
            if(pickerBg === 'cucquang') stageBgClass = 'bg-gradient-to-br from-purple-500 via-pink-500 to-red-500';
            else if(pickerBg === 'xoaytim') stageBgClass = 'bg-gradient-to-br from-[#1e1b4b] to-purple-900';
            else if(pickerBg === 'luadem') stageBgClass = 'bg-slate-900';
            else if(pickerBg === 'songtim') stageBgClass = 'bg-gradient-to-r from-fuchsia-600 to-purple-600';
            else if(pickerBg === 'daiduong') stageBgClass = 'bg-gradient-to-br from-cyan-500 to-blue-700';

            const renderEffectBtn = (id, icon, label) => {
                const isActive = pickerMode === id;
                return `<button onclick="changePickerMode('${id}')" class="flex-1 py-2.5 px-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all ${isActive ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}"><i class="ph-fill ${icon} text-lg"></i> ${label}</button>`;
            };

            const renderBgBtn = (id, colorClass, label) => {
                const isActive = pickerBg === id;
                return `<button onclick="changePickerBg('${id}')" class="h-10 rounded-xl text-xs font-bold text-white shadow-sm transition-all border-2 ${isActive ? 'border-emerald-500 scale-105' : 'border-transparent hover:scale-105'} ${colorClass}">${label}</button>`;
            }

            return `
                <div class="animate-fade-in flex h-full gap-6 pb-4">
                    <div class="w-80 flex-shrink-0 bg-emerald-50/50 rounded-[2rem] border border-emerald-100 flex flex-col h-full overflow-y-auto custom-scrollbar p-5">
                        <div class="flex gap-2 mb-6 bg-white p-1 rounded-xl shadow-sm border border-slate-200">
                            <button onclick="changePickTarget('student')" class="flex-1 py-2 rounded-lg text-sm font-bold transition-all ${pickTarget === 'student' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-500 hover:bg-slate-50'}">Học sinh</button>
                            <button onclick="changePickTarget('group')" class="flex-1 py-2 rounded-lg text-sm font-bold transition-all ${pickTarget === 'group' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-500 hover:bg-slate-50'}">Nhóm/Tổ</button>
                        </div>

                        <div class="mb-6 space-y-3">
                            <div class="text-[11px] font-black text-emerald-800/60 uppercase tracking-widest pl-1 mb-2">Hiệu ứng bay</div>
                            <div class="flex gap-3">${renderEffectBtn('chaos', 'ph-arrows-out', 'Hỗn loạn')}${renderEffectBtn('spiral', 'ph-spiral', 'Trôn ốc')}</div>
                            <div class="flex gap-3">${renderEffectBtn('planet', 'ph-planet', 'Hành tinh')}${renderEffectBtn('wave', 'ph-wave-sine', 'Sóng')}</div>
                            <div class="flex gap-3">${renderEffectBtn('bubbles', 'ph-circles-three', 'Bong bóng')}${renderEffectBtn('figure8', 'ph-infinity', 'Số 8')}</div>
                        </div>

                        <div class="mb-8">
                            <div class="text-[11px] font-black text-emerald-800/60 uppercase tracking-widest pl-1 mb-3">Nền sân khấu</div>
                            <div class="grid grid-cols-2 gap-2.5">
                                <button onclick="changePickerBg('default')" class="h-10 rounded-xl text-xs font-bold text-slate-600 bg-white shadow-sm transition-all border-2 ${pickerBg==='default' ? 'border-emerald-500' : 'border-slate-200 hover:border-slate-300'}">Mặc định</button>
                                ${renderBgBtn('cucquang', 'bg-gradient-to-r from-pink-500 to-purple-500', 'Cực quang')}
                                ${renderBgBtn('xoaytim', 'bg-gradient-to-r from-[#1e1b4b] to-purple-600', 'Xoáy tím')}
                                ${renderBgBtn('luadem', 'bg-slate-900', 'Lửa đêm')}
                                ${renderBgBtn('songtim', 'bg-fuchsia-500', 'Sóng tím')}
                                ${renderBgBtn('daiduong', 'bg-cyan-600', 'Đại dương')}
                            </div>
                        </div>

                        <div class="mt-auto space-y-4">
                            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-slate-600">Thời gian gọi:</span>
                                    <span class="text-sm font-black text-emerald-600">${pickerTime}s</span>
                                </div>
                                <input type="range" min="1" max="10" value="${pickerTime}" onchange="pickerTime=parseInt(this.value); renderLayout();" class="w-full accent-emerald-600 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                            </div>

                            <button onclick="startPicking()" id="btn-start-pick" class="w-full py-4 bg-emerald-600 text-white font-black rounded-2xl shadow-lg hover:bg-emerald-700 transition-all hover:-translate-y-1 flex items-center justify-center gap-2 text-lg">
                                <i class="ph-fill ph-play text-2xl"></i> BẮT ĐẦU GỌI
                            </button>
                        </div>
                    </div>

                    <div class="flex-1 rounded-[2rem] overflow-hidden relative border border-slate-200 shadow-inner ${stageBgClass} transition-colors duration-500" id="picker-stage"></div>
                </div>
            `;
        }

        window.changePickerMode = function(mode) { pickerMode = mode; renderLayout(); }
        window.changePickerBg = function(bg) { pickerBg = bg; renderLayout(); }
        window.changePickTarget = function(target) { pickTarget = target; renderLayout(); }

        function initPickerCards() {
            const stage = document.getElementById('picker-stage');
            if (!stage) return;
            stage.innerHTML = '';
            
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            if(listItems.length === 0) {
                stage.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-xl font-bold ${pickerBg === 'default' ? 'text-slate-400' : 'text-white/50'}">Chưa có dữ liệu.</div>`;
                return;
            }

            pickerItems = listItems.map((item, index) => {
                const el = document.createElement('div');
                el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 transition-transform border border-slate-100 will-change-transform z-10`;
                el.style.width = '110px';
                el.style.height = '130px';
                
                const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
                const borderColor = colors[index % colors.length];

                let avatarHtml = '';
                if(pickTarget === 'student') {
                    avatarHtml = getAvatarImg(item.avatarUrl, item.name, "w-16 h-16 pointer-events-none ring-4 ring-white");
                } else {
                    avatarHtml = item.avatarUrl ? `<img src="${item.avatarUrl}" class="w-16 h-16 rounded-full object-cover ring-4 ring-white pointer-events-none">` : `<div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center ring-4 ring-white"><i class="ph-fill ph-users-three text-3xl text-slate-400"></i></div>`;
                }

                el.innerHTML = `
                    <div class="rounded-full p-1" style="background: linear-gradient(135deg, ${borderColor} 0%, transparent 100%);">
                        ${avatarHtml}
                    </div>
                    <div class="text-xs font-black text-slate-800 text-center w-full truncate leading-tight pointer-events-none">${item.name}</div>
                `;
                
                stage.appendChild(el);

                const stageWidth = stage.offsetWidth;
                const stageHeight = stage.offsetHeight;
                
                return {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * (stageWidth - 150),
                    y: (Math.random() - 0.5) * (stageHeight - 150),
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    radius: 50 + Math.random() * 200,
                    baseX: 0, baseY: 0
                };
            });
        }

        function animatePicker() {
            if(!pickerItems.length) return;
            const stage = document.getElementById('picker-stage');
            if (!stage) { cancelAnimationFrame(pickerAnimationId); return; }
            
            const stageWidth = stage.offsetWidth;
            const stageHeight = stage.offsetHeight;
            const time = performance.now() / 1000;

            pickerItems.forEach((item, i) => {
                const speedMulti = isPicking ? 8 : 1; 

                if (pickerMode === 'chaos') {
                    item.x += Math.cos(item.angle) * item.speed * speedMulti;
                    item.y += Math.sin(item.angle) * item.speed * speedMulti;
                    const boundX = stageWidth/2 - 60;
                    const boundY = stageHeight/2 - 70;
                    if (item.x > boundX || item.x < -boundX) item.angle = Math.PI - item.angle;
                    if (item.y > boundY || item.y < -boundY) item.angle = -item.angle;
                    item.angle += (Math.random() - 0.5) * 0.1 * speedMulti;
                } 
                else if (pickerMode === 'spiral') {
                    const t = time * item.speed * speedMulti + i;
                    const r = (Math.sin(time * 0.5) * 0.5 + 0.5) * 300 + 50;
                    item.x = Math.cos(t) * r;
                    item.y = Math.sin(t) * r;
                }
                else if (pickerMode === 'planet') {
                    const t = time * (item.speed/2) * speedMulti;
                    item.x = Math.cos(t + i) * item.radius;
                    item.y = Math.sin(t + i) * item.radius;
                }
                else if (pickerMode === 'wave') {
                    item.x += item.speed * speedMulti * 2;
                    if(item.x > stageWidth/2 + 60) item.x = -stageWidth/2 - 60;
                    item.y = Math.sin(item.x / 100 + time * 5) * 150;
                }
                else if (pickerMode === 'bubbles') {
                    item.y -= item.speed * speedMulti * 2;
                    if(item.y < -stageHeight/2 - 70) item.y = stageHeight/2 + 70;
                    item.x = Math.sin(item.y / 50 + time * 3 + i) * 100 + item.baseX;
                }
                else if (pickerMode === 'figure8') {
                    const t = time * item.speed * speedMulti + i;
                    item.x = Math.sin(t) * (stageWidth/3);
                    item.y = Math.sin(t) * Math.cos(t) * (stageHeight/3);
                }

                item.x = Math.max(-stageWidth/2 + 55, Math.min(stageWidth/2 - 55, item.x));
                item.y = Math.max(-stageHeight/2 + 65, Math.min(stageHeight/2 - 65, item.y));

                item.el.style.transform = `translate(calc(-50% + ${item.x}px), calc(-50% + ${item.y}px))`;
            });

            if(!isPicking || performance.now() < pickEndTime) {
                pickerAnimationId = requestAnimationFrame(animatePicker);
            }
        }

        let pickEndTime = 0;
        window.startPicking = function() {
            if(pickerItems.length === 0) return showToast("Chưa có danh sách!", "error");
            if(isPicking) return;
            
            isPicking = true;
            document.getElementById('btn-start-pick').innerHTML = `<i class="ph-bold ph-spinner-gap text-2xl animate-spin"></i> ĐANG GỌI...`;
            document.getElementById('btn-start-pick').classList.replace('bg-emerald-600', 'bg-slate-400');
            
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); clickSynth.volume.value = -15; } catch(e) {}
            
            let soundInterval = setInterval(() => {
                if(clickSynth && Tone.context.state === 'running') clickSynth.triggerAttackRelease("G5", "32n", Tone.now());
            }, 150);

            pickEndTime = performance.now() + (pickerTime * 1000);

            setTimeout(() => {
                clearInterval(soundInterval);
                finishPick();
            }, pickerTime * 1000);
        }

        function finishPick() {
            isPicking = false;
            cancelAnimationFrame(pickerAnimationId);
            
            const btn = document.getElementById('btn-start-pick');
            if(btn){
                btn.innerHTML = `<i class="ph-fill ph-play text-2xl"></i> GỌI TIẾP`;
                btn.classList.replace('bg-slate-400', 'bg-emerald-600');
            }

            const winnerIndex = Math.floor(Math.random() * pickerItems.length);
            const winner = pickerItems[winnerIndex];

            try { 
                const s = new Tone.PolySynth().toDestination(); 
                s.volume.value = -10;

                                    ${weekHeadersHtml}
                                </tr>
                                <tr>
                                    ${subHeadersHtml}
                                </tr>
                            </thead>
                            <tbody>
                                ${weeklyDataRowsHtml || '<tr><td colspan="100%" class="p-8 text-center text-slate-400 font-medium">Chưa có dữ liệu học sinh.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentReportTab === 'diem-thang') {
                const allMonthsSet = new Set();
                state.students.forEach(s => {
                    if (s.history) {
                        s.history.forEach(h => {
                            if (h.date) {
                                const dateObj = new Date(h.date);
                                const monthYear = `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                                allMonthsSet.add(monthYear);
                            }
                        });
                    }
                });
                if (allMonthsSet.size === 0) {
                    const today = new Date();
                    for (let i = 0; i < 3; i++) {
                        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                        allMonthsSet.add(`${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`);
                    }
                }
                const sortedMonths = Array.from(allMonthsSet).sort((a, b) => {
                    const [monthA, yearA] = a.split('/').map(Number);
                    const [monthB, yearB] = b.split('/').map(Number);
                    if (yearA !== yearB) return yearA - yearB;
                    return monthA - monthB;
                });
                const monthHeadersHtml = sortedMonths.map(month => `
                    <th colspan="2" class="p-3 text-center border-b border-r border-slate-200 bg-slate-50 font-black text-slate-800 text-sm whitespace-nowrap">${month}</th>

                const subHeadersHtml = sortedMonths.map(() => `
                    <th class="p-2 text-center border-b border-r border-slate-200 bg-emerald-50/50 text-emerald-600 font-bold text-xs w-14">+</th>
                    <th class="p-2 text-center border-b border-r border-slate-200 bg-red-50/50 text-red-500 font-bold text-xs w-14">-</th>

                const monthlyDataRowsHtml = sortedStudents.map((s, index) => {
                    const monthlyPoints = {};
                    sortedMonths.forEach(m => monthlyPoints[m] = { plus: 0, minus: 0 });
                    if (s.history) {
                        s.history.forEach(h => {
                            if (h.date && h.points) {
                                const dateObj = new Date(h.date);
                                const monthYear = `${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
                                if (monthlyPoints[monthYear]) {
                                    if (h.points > 0) monthlyPoints[monthYear].plus += h.points;
                                    else monthlyPoints[monthYear].minus += Math.abs(h.points);
                                }
                            }
                        });
                    }
                    const cellsHtml = sortedMonths.map(m => {
                        const plusVal = monthlyPoints[m].plus;
                        const minusVal = monthlyPoints[m].minus;
                        return `
                            <td class="p-3 text-center border-b border-r border-slate-100 font-bold text-emerald-600 bg-emerald-50/30">${plusVal > 0 ? '+' + plusVal : '<span class="text-slate-200 font-normal">-</span>'}</td>

                    }).join('');
                    return `
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="p-3 text-center border-b border-r border-slate-100 text-slate-400 font-bold">${index + 1}</td>

                tabContentHtml = `

                        <table class="w-full text-sm text-left border-collapse min-w-max">
                            <thead>
                                <tr>
                                    <th rowspan="2" class="p-3 text-center border-b border-r border-slate-200 bg-slate-50 font-bold text-slate-500 uppercase tracking-widest text-[10px] w-16">STT</th>
                                    <th rowspan="2" class="p-3 border-b border-r border-slate-200 bg-slate-50 font-bold text-slate-500 uppercase tracking-widest text-[10px]">Tên Học Sinh</th>
                                    ${monthHeadersHtml}
                                </tr>
                                <tr>
                                    ${subHeadersHtml}
                                </tr>
                            </thead>
                            <tbody>
                                ${monthlyDataRowsHtml || '<tr><td colspan="100%" class="p-8 text-center text-slate-400 font-medium">Chưa có dữ liệu học sinh.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentReportTab === 'diem-hoc-ki') {
                const hkDataRowsHtml = sortedStudents.map((s, index) => {
                    let hk1Plus = 0, hk1Minus = 0;
                    let hk2Plus = 0, hk2Minus = 0;
                    if (s.history) {
                        s.history.forEach(h => {
                            if (h.date && h.points) {
                                const d = new Date(h.date);
                                const m = d.getMonth() + 1;
                                
                                if (m >= 8 && m <= 12) {
                                    if (h.points > 0) hk1Plus += h.points;
                                    else hk1Minus += Math.abs(h.points);
                                } else if (m >= 1 && m <= 5) {
                                    if (h.points > 0) hk2Plus += h.points;
                                    else hk2Minus += Math.abs(h.points);
                                }
                            }
                        });
                    }
                    
                    const hk1Total = hk1Plus - hk1Minus;
                    const hk2Total = hk2Plus - hk2Minus;
                    const yearTotal = hk1Total + hk2Total;
                    return `
                        <tr class="hover:bg-slate-50/80 transition-colors">

                            <td class="p-3 text-center border-b border-r border-slate-100 font-bold text-red-500 bg-red-50/30">${hk1Minus > 0 ? '-' + hk1Minus : '<span class="text-slate-200 font-normal">-</span>'}</td>
                            <td class="p-3 text-center border-b border-r border-slate-200 font-bold text-slate-800 bg-slate-100/50">${hk1Total}</td>
                            
                            <td class="p-3 text-center border-b border-r border-slate-100 font-bold text-emerald-600 bg-emerald-50/30">${hk2Plus > 0 ? '+' + hk2Plus : '<span class="text-slate-200 font-normal">-</span>'}</td>
                            <td class="p-3 text-center border-b border-r border-slate-100 font-bold text-red-500 bg-red-50/30">${hk2Minus > 0 ? '-' + hk2Minus : '<span class="text-slate-200 font-normal">-</span>'}</td>
                            <td class="p-3 text-center border-b border-r border-slate-200 font-bold text-slate-800 bg-slate-100/50">${hk2Total}</td>

                        </tr>
                    `;
                }).join('');
                tabContentHtml = `
                    <div class="mt-6 overflow-x-auto custom-scrollbar border border-slate-200 rounded-2xl shadow-sm">
                        <table class="w-full text-sm text-left border-collapse min-w-max">

                                <tr>

                                    <th colspan="3" class="p-3 text-center border-b border-r border-slate-200 bg-slate-50 font-black text-slate-800 text-sm whitespace-nowrap">HỌC KÌ 2 <span class="text-[10px] font-medium text-slate-400 block mt-1">(T1 - T5)</span></th>
                                    <th rowspan="2" class="p-3 text-center border-b border-slate-200 bg-blue-50 font-black text-blue-700 text-xs uppercase tracking-widest whitespace-nowrap">TỔNG KẾT NĂM</th>

                                <tr>
                                    <th class="p-2 text-center border-b border-r border-slate-200 bg-emerald-50/50 text-emerald-600 font-bold text-xs w-20">Cộng</th>
                                    <th class="p-2 text-center border-b border-r border-slate-200 bg-red-50/50 text-red-500 font-bold text-xs w-20">Trừ</th>
                                    <th class="p-2 text-center border-b border-r border-slate-200 bg-slate-100 text-slate-700 font-bold text-xs w-20">Tổng HK1</th>
                                    
                                    <th class="p-2 text-center border-b border-r border-slate-200 bg-emerald-50/50 text-emerald-600 font-bold text-xs w-20">Cộng</th>
                                    <th class="p-2 text-center border-b border-r border-slate-200 bg-red-50/50 text-red-500 font-bold text-xs w-20">Trừ</th>

                            <tbody>

                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                tabContentHtml = `<div class="flex flex-col mt-4">${commentsHtml || '<div class="py-16 text-center text-slate-400 font-medium bg-white border border-slate-200 rounded-[2rem]">Chưa có dữ liệu học sinh.</div>'}</div>`;

                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 mt-4">
                        <div class="bg-gradient-to-br from-[#1e1b4b] to-[#312e81] rounded-[2rem] p-6 shadow-lg shadow-indigo-900/20 text-white relative overflow-hidden group hover:-translate-y-1 transition-transform">

                            <i class="ph-fill ph-users text-5xl absolute right-4 bottom-4 text-white/10 group-hover:text-white/20 transition-colors"></i>
                        </div>
                        
                        <div class="bg-gradient-to-br from-blue-400 to-cyan-500 rounded-[2rem] p-6 shadow-lg shadow-blue-500/20 text-white relative overflow-hidden group hover:-translate-y-1 transition-transform">
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/20 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                            <div class="text-blue-100 text-xs font-bold uppercase tracking-wider mb-2">Tổng điểm thưởng</div>
                            <div class="text-4xl font-black">${totalPoints}</div>
                            <i class="ph-fill ph-star text-5xl absolute right-4 bottom-4 text-white/20 group-hover:text-white/30 transition-colors"></i>
                        </div>

                        <div class="bg-gradient-to-br from-emerald-400 to-teal-500 rounded-[2rem] p-6 shadow-lg shadow-emerald-500/20 text-white relative overflow-hidden group hover:-translate-y-1 transition-transform">
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/20 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
                            <div class="text-emerald-100 text-xs font-bold uppercase tracking-wider mb-2">Điểm trung bình</div>
                            <div class="text-4xl font-black">${avgPoints}</div>
                            <i class="ph-fill ph-chart-line-up text-5xl absolute right-4 bottom-4 text-white/20 group-hover:text-white/30 transition-colors"></i>
                        </div>

                        <div class="bg-white border-2 border-slate-100 rounded-[2rem] p-6 shadow-sm relative overflow-hidden group hover:-translate-y-1 transition-transform hover:border-blue-200">
                            <div class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Điểm danh (${formattedDate})</div>
                            <div class="flex gap-4 mt-3">
                                <div class="text-sm font-bold text-slate-700">Có mặt: <span class="text-emerald-500 font-black text-lg">${present}</span></div>
                                <div class="text-sm font-bold text-slate-700">Vắng: <span class="text-red-500 font-black text-lg">${absent}</span></div>
                            </div>
                            <i class="ph-fill ph-calendar-check text-5xl absolute right-4 bottom-4 text-slate-100 group-hover:text-blue-50 transition-colors"></i>

                    <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-100">

                            <div id="report-tab-switcher" class="flex bg-slate-100 p-1.5 rounded-xl print:hidden w-full xl:w-auto overflow-x-auto custom-scrollbar flex-shrink-0">

                                <button onclick="switchReportTab('diem-tuan')" class="flex-1 sm:flex-none whitespace-nowrap px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${currentReportTab === 'diem-tuan' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}"><i class="ph-bold ph-calendar-blank mr-1"></i> Điểm Tuần</button>
                                <button onclick="switchReportTab('diem-thang')" class="flex-1 sm:flex-none whitespace-nowrap px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${currentReportTab === 'diem-thang' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}"><i class="ph-bold ph-calendar mr-1"></i> Điểm Tháng</button>
                                <button onclick="switchReportTab('diem-hoc-ki')" class="flex-1 sm:flex-none whitespace-nowrap px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${currentReportTab === 'diem-hoc-ki' ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}"><i class="ph-bold ph-books mr-1"></i> Điểm Học Kì</button>
                                <button onclick="switchReportTab('nhan-xet')" class="flex-1 sm:flex-none whitespace-nowrap px-6 py-2.5 rounded-lg text-sm font-bold transition-all ${currentReportTab === 'nhan-xet' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}"><i class="ph-fill ph-chat-centered-text mr-1"></i> Nhận Xét</button>

                        </div>
                        ${tabContentHtml}
                    </div>
                </div>
            `;
        }

        function renderSheetConnectionPanel() {
            const report = window.googleSheetHealthReport || null;
            const connectionError = String(window.googleSheetHealthError || "").trim();

            let statusLabel = "Chưa kiểm tra";
            let statusClass = "bg-slate-100 text-slate-600 border-slate-200";
            let statusIcon = "ph-question";
            let summaryHtml = `
                <div class="py-8 text-center text-slate-500">
                    <i class="ph-duotone ph-plugs-connected text-4xl text-slate-300"></i>
                    <p class="mt-3 font-bold text-slate-700">Chưa kiểm tra nguồn dữ liệu</p>
                    <p class="mt-1 text-sm">Bấm “Kiểm tra kết nối” để rà soát các sheet và cột cần thiết.</p>
                </div>
            `;

            if (connectionError && !report) {
                statusLabel = "Không kết nối được";
                statusClass = "bg-red-50 text-red-700 border-red-200";
                statusIcon = "ph-x-circle";
                summaryHtml = `
                    <div class="p-4 rounded-xl border border-red-200 bg-red-50 text-red-700 text-sm font-semibold">
                        ${escapeHtmlText(connectionError)}
                    </div>
                `;
            }

            if (report) {
                const errorCount = Number(report.errorCount || 0);
                const warningCount = Number(report.warningCount || 0);
                const checkedDate = new Date(report.updatedAt || "");
                const checkedAt = Number.isNaN(checkedDate.getTime())
                    ? ""
                    : checkedDate.toLocaleString("vi-VN");
                const sheets = Array.isArray(report.sheets)
                    ? report.sheets
                    : [];

                if (errorCount) {
                    statusLabel = "Cần sửa";
                    statusClass = "bg-red-50 text-red-700 border-red-200";
                    statusIcon = "ph-x-circle";
                } else if (warningCount) {
                    statusLabel = "Có cảnh báo";
                    statusClass = "bg-amber-50 text-amber-700 border-amber-200";
                    statusIcon = "ph-warning-circle";
                } else {
                    statusLabel = "Sẵn sàng";
                    statusClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
                    statusIcon = "ph-check-circle";
                }

                const sheetsHtml = sheets.map(item => {
                    const itemStatus = String(item.status || "warning");
                    const itemClass = itemStatus === "error"
                        ? "border-red-200 bg-red-50/70"
                        : itemStatus === "warning"
                            ? "border-amber-200 bg-amber-50/70"
                            : "border-emerald-200 bg-emerald-50/70";
                    const iconClass = itemStatus === "error"
                        ? "ph-x-circle text-red-500"
                        : itemStatus === "warning"
                            ? "ph-warning-circle text-amber-500"
                            : "ph-check-circle text-emerald-500";
                    const issues = []
                        .concat(Array.isArray(item.missingRequired)
                            ? item.missingRequired
                            : [])
                        .concat(Array.isArray(item.warnings)
                            ? item.warnings
                            : []);
                    const issueHtml = issues.length
                        ? `<ul class="mt-2 space-y-1 text-xs text-slate-600">${issues.map(issue =>
                            `<li class="flex items-start gap-1.5"><span class="mt-1 w-1.5 h-1.5 rounded-full bg-current flex-shrink-0"></span><span>${escapeHtmlText(issue)}</span></li>`
                        ).join("")}</ul>`
                        : '<p class="mt-2 text-xs font-bold text-emerald-700">Cấu trúc hợp lệ</p>';

                    return `
                        <div class="p-4 rounded-2xl border ${itemClass}">
                            <div class="flex items-start justify-between gap-3">
                                <div>
                                    <div class="font-black text-slate-800">${escapeHtmlText(item.name || "")}</div>
                                    <div class="mt-0.5 text-xs text-slate-500">${escapeHtmlText(item.details || "")}</div>
                                </div>
                                <i class="ph-fill ${iconClass} text-xl flex-shrink-0"></i>
                            </div>
                            ${issueHtml}
                        </div>
                    `;
                }).join("");

                summaryHtml = `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                            <div class="text-[11px] font-black uppercase tracking-wider text-slate-400">Google Sheet</div>
                            <div class="mt-1 font-black text-slate-800 truncate" title="${escapeHtmlAttr(report.spreadsheetName || "")}">${escapeHtmlText(report.spreadsheetName || "Chưa xác định")}</div>
                        </div>
                        <div class="p-4 rounded-2xl bg-blue-50 border border-blue-100">
                            <div class="text-[11px] font-black uppercase tracking-wider text-blue-400">Học sinh</div>
                            <div class="mt-1 text-2xl font-black text-blue-700">${Number(report.studentCount || 0)}</div>
                        </div>
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                            <div class="text-[11px] font-black uppercase tracking-wider text-slate-400">Kiểm tra lúc</div>
                            <div class="mt-1 font-bold text-slate-700 text-sm">${escapeHtmlText(checkedAt || "Vừa xong")}</div>
                        </div>
                        <div id="attendance-save-status" class="w-full">
                            ${renderAttendanceSaveStatus(currentAttendanceDate)}
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${sheetsHtml}
                    </div>
                `;
            }

            return `
                <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-sm border border-slate-100">
                    <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 mb-6">
                        <div>
                            <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                                <i class="ph-fill ph-cloud-check text-blueAccent"></i>
                                Kết nối Google Sheet
                            </h3>
                            <p class="mt-2 text-sm text-slate-500 max-w-2xl">
                                Kiểm tra file dữ liệu, các sheet bắt buộc và tiêu đề cột trước khi sử dụng.
                            </p>
                        </div>
                        <span class="inline-flex self-start items-center gap-2 px-3 py-2 rounded-xl border text-xs font-black ${statusClass}">
                            <i class="ph-fill ${statusIcon} text-base"></i>
                            ${statusLabel}
                        </span>
