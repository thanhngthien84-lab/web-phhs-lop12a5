        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }
        function escapeHtmlAttr(str) { return str ? String(str).replace(/"/g, '&quot;') : ''; }

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')

        function generateUniqueCode() {

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

            const defaultRewards = [

        function renderBottomNav() {
            let activeMenuItems = menuItems;
            if (state.auth && state.auth.role === 'bancansu') {
                activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'diem-danh'].includes(item.id));
            } else if (state.auth && state.auth.role === 'bgh') {
                activeMenuItems = menuItems.filter(item => ['tong-quan', 'hoc-sinh', 'thoi-khoa-bieu', 'so-do-lop', 'diem-danh', 'bao-cao', 'tram-dong-hanh'].includes(item.id));
            }

            const menuHtml = activeMenuItems.map(item => {
                const isActive = state.currentTab === item.id;
                const activeClass = isActive 
                    ? "text-white bg-blue-600 shadow-[0_4px_15px_rgba(37,99,235,0.4)] transform -translate-y-1.5" 
                    : "text-[#94a3b8] hover:text-white hover:bg-white/5";

                let onclickAction = `switchTab('${item.id}')`;
                if (item.id === 'dong-ho') onclickAction = 'openTimerDrawer()';
                if (item.id === 'tich-diem') onclickAction = `switchTab('cai-dat'); switchSettingsTab('tich-diem');`;

                return `
                <button onclick="${onclickAction}" class="flex flex-col items-center justify-center min-w-[70px] w-20 py-2 rounded-[1rem] transition-all duration-300 ${activeClass}">

                    <span class="text-[10px] font-bold whitespace-nowrap tracking-wide">${item.label}</span>

            }).join('');

            return `
                <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-[#1e1b4b] border-t border-indigo-900 shadow-[0_-10px_40px_rgba(0,0,0,0.2)] z-50 overflow-x-auto pb-1 custom-scrollbar">
                    <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                    <div class="flex items-center gap-1.5 px-3 pt-2 pb-2 relative z-10 w-max min-w-full">
                        ${menuHtml}
                    </div>
                </nav>

        }

        function renderHeader() {
            const syncStatus = `<div class="hidden sm:flex items-center gap-2 text-[11px] font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200"><i class="ph-fill ph-hard-drives text-sm"></i> Lưu cục bộ</div>`;

            let roleDesc = state.admin.role;
            if (state.auth && state.auth.role === 'bancansu') {
                roleName = 'Ban Cán Sự';
                roleDesc = 'Quản lý lớp';
            } else if (state.auth && state.auth.role === 'bgh') {
                roleName = 'Ban Giám Hiệu';
                roleDesc = 'Giám sát hệ thống';
            }

            const phhsLinkUrl = currentSheetId ? `?phhs=1&sheetId=${encodeURIComponent(currentSheetId)}` : `?phhs=1`;

            return `

                        <h2 class="text-xl font-black text-slate-800 tracking-tight hidden md:block capitalize">${menuItems.find(m => m.id === state.currentTab)?.label || 'Bảng điều khiển'}</h2>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <a href="${phhsLinkUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 text-xs font-bold text-white bg-gradient-to-r from-orange-400 to-amber-500 px-4 py-2 rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all" title="Mở trang tra cứu PHHS ở tab mới" aria-label="Link PHHS">
                            <i class="ph-bold ph-link text-sm"></i> <span>Link PHHS</span>
                        </a>
                        ${syncStatus}
                        <div class="flex items-center gap-3 bg-white border border-slate-200 py-1.5 px-2 sm:px-4 rounded-2xl shadow-sm transition-all">
                            <div class="text-right hidden sm:block ${(!state.auth || state.auth.role === 'gvcn') ? 'cursor-pointer group hover:text-blueAccent' : ''}" ${(!state.auth || state.auth.role === 'gvcn') ? 'onclick="openEditAdminModal()"' : ''}>
                                <div class="text-xs font-bold text-slate-800 transition-colors">${roleName}</div>
                                <div class="text-[9px] text-slate-500 uppercase tracking-widest font-semibold">${roleDesc}</div>
                            </div>
                            <div class="relative flex-shrink-0 ${(!state.auth || state.auth.role === 'gvcn') ? 'cursor-pointer group hover:scale-105 transition-transform' : ''}" ${(!state.auth || state.auth.role === 'gvcn') ? 'onclick="openEditAdminModal()"' : ''}>
                                ${getAvatarImg(state.admin.avatarUrl, state.admin.name, "w-9 h-9")}
                            </div>
                        </div>
                    </div>
                </header>
            `;
        }

        window.closeModal = function(id) { 
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = ''; 
            if (id) {
                const modal = document.getElementById(id);
                if (modal) modal.remove();
            }
        };

        function renderLayout() {
            const app = document.getElementById('app');
            let contentHtml = '';
            switch (state.currentTab) {
                case 'tong-quan': contentHtml = renderViewTongQuan(); break;
                case 'hoc-sinh': contentHtml = renderViewHocSinh(); break;
                case 'diem-hoc-tap': contentHtml = renderViewDiemHocTap(); break;
                case 'thoi-khoa-bieu': contentHtml = renderViewThoiKhoaBieu(); break;
                case 'so-do-lop': contentHtml = renderViewSoDoLop(); break;
                case 'lich-bao-giang': contentHtml = renderViewLichBaoGiang(); break;
                case 'tich-diem': contentHtml = renderViewTichDiem(); break;
                case 'doi-qua': contentHtml = renderViewDoiQua(); break;
                case 'nhom-thi-dua': contentHtml = renderViewNhomThiDua(); break;
                case 'diem-danh': contentHtml = renderViewDiemDanh(); break;
                case 'vong-quay': contentHtml = renderViewVongQuay(); break;
                case 'xep-hang': contentHtml = renderViewXepHang(); break;
                case 'bao-cao': contentHtml = renderViewBaoCao(); break;
                case 'tram-dong-hanh': contentHtml = renderViewTramDongHanh(); break;
                case 'cai-dat': contentHtml = renderViewCaiDat(); break;
                default: contentHtml = `<div class="p-12 text-center text-slate-500 font-medium">Tính năng đang được phát triển...</div>`;
            }
            
            const isRightSidebar = state.settings.sidebarPosition === 'right';
            
            app.innerHTML = `
                ${!isRightSidebar ? renderSidebar() : ''}
                <div class="flex-1 flex flex-col h-full overflow-hidden relative bg-[#f8fafc]" id="main-container">
                    ${renderHeader()}

                        ${contentHtml}
                    </main>
                    ${renderBottomNav()}
                    <div id="modal-container" class="print:hidden"></div>
                </div>
                ${isRightSidebar ? renderSidebar() : ''}
            `;
            
            cancelAnimationFrame(pickerAnimationId);
            if (state.currentTab === 'vong-quay') {
                setTimeout(() => {
                    initPickerCards();
                    pickerAnimationId = requestAnimationFrame(animatePicker);
                }, 50);
            }
        }

        function renderViewTongQuan() {
            const d = new Date();
            const todayStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const todayRecord = state.attendanceRecords[todayStr] || {};
            let absentCount = 0;
            state.students.forEach(s => {
                const status = todayRecord[s.id];
                if (status === 'excused' || status === 'unexcused') absentCount++;
            });
            
            const totalStudents = state.students.length;
            const presentStudents = totalStudents - absentCount;
            const goodPointsCount = state.students.filter(s => (s.points || 0) >= 10).length;
            
            let learningPercent = 100;
            if (totalStudents > 0) {
                const positiveStudents = state.students.filter(s => (s.points || 0) >= 0).length;
                learningPercent = Math.round((positiveStudents / totalStudents) * 100);
            }
        
            const negativeStudentsCount = state.students.filter(s => (s.points || 0) < 0).length;
            const totalIssues = absentCount + negativeStudentsCount;
            
            let disciplineStatus = "Tốt";
            let disciplineColor = "text-emerald-500";
            let disciplineIcon = "🟢";
            
            if (totalStudents > 0) {
                const issueRatio = totalIssues / totalStudents;
                if (issueRatio >= 0.3) { 
                    disciplineStatus = "Cần cố gắng";
                    disciplineColor = "text-red-500";
                    disciplineIcon = "🔴";
                } else if (issueRatio > 0.1) { 
                    disciplineStatus = "Khá";
                    disciplineColor = "text-yellow-500";
                    disciplineIcon = "🟡";
                }
            }

            const sortedStudents = [...state.students].sort((a, b) => (b.points || 0) - (a.points || 0));
            const top3StudentsHtml = sortedStudents.slice(0, 3).map((s, index) => {
                const medals = ['🥇', '🥈', '🥉'];
                const weekProg = s.points > 0 ? Math.floor((Math.sin(s.id * 10) + 1) * 5) + 2 : 0;
                return `
                    <div class="bg-white/10 hover:bg-white/20 p-4 rounded-2xl border border-white/5 transition-all cursor-pointer group" onclick="switchTab('tich-diem'); selectStudentForPoints(${toInlineJsValue(s.id)})">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-2xl">${medals[index]}</span>
                            <div class="font-bold text-white text-base">${s.name}</div>
                            <div class="text-white ml-auto font-black flex items-center gap-1">— ${s.points || 0} điểm</div>
                        </div>
                        <div class="pl-10 text-xs text-emerald-300 font-bold flex items-center gap-1">
                            <div class="w-1 h-4 bg-emerald-400/50 rounded-full mr-1"></div>
                            +${weekProg} điểm tuần này <i class="ph-bold ph-arrow-up text-emerald-400"></i>
                        </div>
                    </div>
                `;
            }).join('');
            
            const studentsWithProgress = state.students.map(s => {
                const weekProg = (s.points || 0) > 0 ? Math.floor((Math.sin(s.id * 10) + 1) * 15) + 5 : 0; 
                return { ...s, weekProg: Math.min(weekProg, s.points || 0) };
            });
            const topProgressHtml = [...studentsWithProgress].sort((a,b) => b.weekProg - a.weekProg).slice(0, 3).map(s => {
                const stars = '⭐'.repeat(Math.min(3, Math.ceil(s.weekProg / 5))) || '⭐';
                return `
                    <div class="bg-white/10 hover:bg-white/20 p-4 rounded-2xl border border-white/5 transition-all cursor-pointer group mb-3" onclick="switchTab('tich-diem'); selectStudentForPoints(${toInlineJsValue(s.id)})">
                        <div class="font-bold text-white text-base mb-0.5">${s.name}</div>
                        <div class="text-[11px] text-blue-200 uppercase font-bold tracking-wider mb-2 opacity-80">${s.group}</div>
                        <div class="flex items-center gap-2 text-sm text-yellow-300 font-bold">
                            ${stars} <span class="text-white ml-1">+${s.weekProg} điểm tuần này <i class="ph-bold ph-arrow-up text-emerald-300"></i></span>
                        </div>
                    </div>
                `;
            }).join('');
            
            const tasks = state.tasks || [];
            const tasksHtml = tasks.length === 0 
                ? '<div class="text-center py-12 text-slate-400 italic font-medium">✨ Thầy/cô đã xử lý xong mọi việc!</div>'
                : tasks.map(t => {
                    const colorClass = t.level === 'red' ? 'red-500' : t.level === 'yellow' ? 'amber-500' : 'emerald-500';
                    return `
                    <div class="flex items-start gap-3 mb-4 group relative bg-slate-50/50 p-4 rounded-xl border border-slate-100 hover:bg-slate-50 transition-colors">
                        <div class="w-3 h-3 rounded-full mt-1.5 bg-${colorClass} shadow-sm flex-shrink-0"></div>
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-slate-800 text-sm truncate">${t.content}</div>
                            <div class="text-xs text-slate-500 mb-1.5 mt-1">${t.person} ${t.deadline ? '— Hạn: <span class="font-bold text-slate-700">' + t.deadline.split('-').reverse().join('/') + '</span>' : ''}</div>
                            ${t.note ? `<div class="text-[11px] text-slate-400 italic bg-white p-2 rounded-lg border border-slate-100 shadow-sm">${t.note}</div>` : ''}
                        </div>
                        <button onclick="deleteTask(${t.id})" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-opacity p-1.5 bg-white rounded-full shadow-sm" title="Tíc hoàn thành"><i class="ph-bold ph-check text-lg"></i></button>
                    </div>
                    `;
                }).join('');
            
            const journeys = state.journeys || [];
            const journeysHtml = journeys.length === 0
                ? '<div class="text-center py-12 text-slate-400 italic font-medium">✨ Hãy tạo cột mốc đầu tiên cho hành trình của lớp!</div>'
                : journeys.map(j => `
                    <div class="relative pl-12 mb-6 group">
                        <div class="absolute left-0 top-0 w-8 h-8 bg-emerald-50 rounded-full border-2 border-emerald-100 flex items-center justify-center text-sm z-10 shadow-sm">${j.icon}</div>
                        <div class="absolute left-4 top-8 bottom-[-24px] w-px bg-slate-200 group-last:bg-transparent"></div>
                        <div class="font-bold text-slate-800 mb-0.5 text-sm">${j.date ? j.date.split('-').reverse().join('/') : ''}</div>
                        <div class="text-sm text-emerald-700 font-bold mb-1.5">${j.title}</div>
                        ${j.content ? `<div class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 mt-1.5 shadow-inner leading-relaxed">${j.content}</div>` : ''}
                        <button onclick="deleteJourney(${j.id})" class="absolute right-0 top-0 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-opacity p-1" title="Xóa cột mốc"><i class="ph-fill ph-trash text-lg"></i></button>
                    </div>
                `).join('');
                
            const currentYear = state.academicYear || '2026 - 2027';
            if (!window.realtimeClockInterval) {
                window.realtimeClockInterval = setInterval(() => {
                    const clockEl = document.getElementById('realtime-clock');
                    if (clockEl) clockEl.innerText = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }, 1000);
            }

            return `
                <div class="max-w-7xl mx-auto space-y-6 animate-fade-in pb-12 pt-2">
                    <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-3 md:px-5 rounded-[1.5rem] shadow-sm border border-slate-100 gap-4 mb-2">

                            <div class="p-2 md:p-2.5 bg-blue-50 text-blueAccent rounded-xl"><i class="ph-fill ph-calendar-blank text-xl md:text-2xl"></i></div>
                            <select onchange="state.academicYear = this.value; saveData();" class="bg-transparent font-black text-slate-700 text-sm md:text-base outline-none cursor-pointer focus:ring-0">
                                <option value="2025 - 2026" ${currentYear === '2025 - 2026' ? 'selected' : ''}>Năm học 2025 - 2026</option>
                                <option value="2026 - 2027" ${currentYear === '2026 - 2027' ? 'selected' : ''}>Năm học 2026 - 2027</option>
                                <option value="2027 - 2028" ${currentYear === '2027 - 2028' ? 'selected' : ''}>Năm học 2027 - 2028</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-2 px-5 py-2.5 bg-slate-800 text-white rounded-xl shadow-inner justify-center min-w-[140px]">
                            <i class="ph-fill ph-clock text-emerald-400 animate-pulse text-lg"></i>
                            <span id="realtime-clock" class="font-black tracking-widest text-sm md:text-base w-[70px] text-center">${new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
                        </div>
                    </div>
                    
                    <div>
                        <div class="w-full h-40 md:h-56 ${state.theme.bannerUrl ? 'bg-cover bg-center' : `bg-gradient-to-br ${state.theme.bannerColorClass}`} rounded-[2rem] shadow-sm relative flex flex-col items-center justify-center group overflow-hidden" ${state.theme.bannerUrl ? `style="background-image: url('${state.theme.bannerUrl}');"` : ''}>
                            ${!state.theme.bannerUrl ? `
                                <div class="text-white/80 text-[11px] font-bold uppercase tracking-[0.25em] mb-3 z-10">${state.theme.month}</div>
                                <h1 class="text-white text-3xl md:text-5xl font-black uppercase tracking-tight text-center px-4 z-10 drop-shadow-md">${state.theme.title}</h1>
                            ` : ''}
                            <button onclick="openEditThemeModal()" class="absolute top-4 right-4 bg-black/40 text-white rounded-full p-2.5 opacity-0 group-hover:opacity-100 transition-all z-20 hover:bg-black/60"><i class="ph-fill ph-pencil-simple text-base"></i></button>
                        </div>
                        
                        <div class="mt-4 bg-white rounded-2xl p-4 md:p-5 shadow-sm border-l-4 border-emerald-400 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div class="flex items-center gap-2 text-sm font-bold text-slate-800 mb-1">
                                    <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/50"></div>
                                    <span class="outline-none cursor-text hover:bg-slate-50 transition-colors px-1 rounded" contenteditable="true" onblur="state.theme.weekTitle = this.innerText; saveData();" title="Nhấn vào để sửa thông tin tuần">${state.theme.weekTitle || 'TUẦN 2 — 17/08 ➔ 22/08'}</span>
                                </div>
                                <div class="text-sm text-slate-600 pl-5">
                                    <span class="outline-none cursor-text hover:bg-slate-50 transition-colors px-1 rounded" contenteditable="true" onblur="state.theme.weekTopic = this.innerHTML; saveData();" title="Nhấn vào để sửa chủ đề">${state.theme.weekTopic || 'Chủ đề: <span class="font-bold text-slate-800">Văn minh – Xanh – An toàn</span>'}</span>
                                </div>
                            </div>
                            <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-3 flex items-start gap-2">
                                🎯 <span class="text-sm text-blue-800 italic outline-none cursor-text hover:bg-blue-100/50 transition-colors px-1 rounded" contenteditable="true" onblur="state.theme.weeklyGoal = this.innerText; saveData();" title="Nhấn vào để sửa">${state.theme.weeklyGoal || 'Mục tiêu tuần: Ổn định nề nếp – xây dựng tinh thần tập thể'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-4 uppercase tracking-wide">
                            📊 TÌNH HÌNH LỚP HÔM NAY
                        </h3>
                        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">👨‍🎓 SĨ SỐ</div>
                                <div class="text-3xl font-black text-slate-800 mt-auto">${presentStudents}<span class="text-lg text-slate-400">/${totalStudents}</span></div>
                            </div>
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">📚 HỌC TẬP</div>
                                <div class="text-3xl font-black text-blueAccent mt-auto">${learningPercent}%</div>
                            </div>
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">${disciplineIcon} NỀN NẾP</div>
                                <div class="text-2xl font-black ${disciplineColor} mt-auto">${disciplineStatus}</div>
                            </div>
                            <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-slate-100 flex flex-col">
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5 mb-2">⭐ ĐIỂM TỐT</div>
                                <div class="text-3xl font-black text-yellow-500 mt-auto">${goodPointsCount}</div>
                            </div>
                            <button onclick="switchTab('diem-danh')" class="bg-red-50 hover:bg-red-100 transition-colors rounded-[1.5rem] p-5 shadow-sm border border-red-100 flex flex-col text-left cursor-pointer">
                                <div class="text-xs font-bold text-red-600 uppercase tracking-widest flex items-center gap-1.5 mb-2">⚠️ CẦN LƯU Ý</div>

                            <button onclick="openBulkStudentModal()" class="w-full px-5 py-3 bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold rounded-xl text-sm shadow-sm hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2"><i class="ph-bold ph-rows-plus-bottom text-lg"></i> Nhập nhanh</button>

        function homeworkUI() {
            if(!window.hwUI)window.hwUI={date:new Date().toLocaleDateString("sv-SE"),subjectCode:"TOAN",title:"",students:[],records:[],draft:{},loaded:false,busy:false,dirty:false};
            return window.hwUI;
        }

        function homeworkStatusLabels(){return {done:"Hoàn thành",missing:"Chưa làm",partial:"Làm chưa đủ",supplemented:"Đã bổ sung"};}

        function homeworkTabs() {
            const active=window.learningSection||"scores";
            return '<div class="flex gap-2 mb-5" role="group" aria-label="Nội dung học tập">'+[["scores","Điểm kiểm tra"],["homework","BTVN"]].map(x=>'<button onclick="changeLearningSection(\''+x[0]+'\')" class="px-5 py-3 rounded-xl font-bold '+(active===x[0]?'bg-indigo-600 text-white':'bg-white border border-slate-200 text-slate-600')+'">'+x[1]+'</button>').join("")+'</div>';
        }

        function changeLearningSection(section) {
            if(homeworkUI().busy)return;
            if(homeworkUI().dirty&&!confirm("BTVN chưa lưu. Bạn muốn bỏ phần đang sửa?"))return;
            prepareHomeworkDraft();
            window.learningSection=section;renderLayout();
            if(section==="homework"&&!homeworkUI().loaded)loadHomework();
        }

        function renderViewDiemHocTap(){return homeworkTabs()+(window.learningSection==="homework"?renderHomework():renderViewScoreEntry());}

        function homeworkRequest(mode,params) {
            return new Promise((resolve,reject)=>{
                const callback="hw_"+Date.now()+"_"+Math.floor(Math.random()*1e8),script=document.createElement("script");
                let finished=false;
                const timer=setTimeout(()=>finish(null),35000);
                function finish(r){
                    if(finished)return;finished=true;clearTimeout(timer);script.remove();
                    window[callback]=()=>{};setTimeout(()=>delete window[callback],60000);
                    if(!r||!r.ok){reject(new Error(r&&r.message||"Chưa xác nhận được kết quả từ Sheet."));return;}
                    resolve(r);
                }
                window[callback]=finish;script.onerror=()=>finish(null);
                script.src = getApiUrl(new URLSearchParams({mode,...params,callback}).toString());
                document.head.appendChild(script);
            });
        }

        function prepareHomeworkDraft() {
            const h=homeworkUI();h.draft={};h.title="";
            h.students.forEach(s=>{h.draft[s.studentCode]={status:"",note:""};});
            h.records.filter(r=>r.date===h.date&&r.subjectCode===h.subjectCode).forEach(r=>{
                h.draft[r.studentCode]={status:r.status,note:r.note||""};if(!h.title)h.title=r.title||"";
            });
            h.dirty=false;
        }

        async function loadHomework() {
            const h=homeworkUI();if(h.busy)return;
            if(h.dirty&&!confirm("Tải lại sẽ bỏ BTVN chưa lưu. Tiếp tục?"))return;
            const key=getGoogleAdminKey();if(!key)return;
            h.busy=true;renderLayout();
            try{
                const r=await homeworkRequest("homework",{adminKey:key});h.records=r.records||[];h.students=r.students||[];h.loaded=true;prepareHomeworkDraft();rememberGoogleAdminKey(key);
            }catch(e){showToast(e.message,"error");}
            finally{h.busy=false;if(window.learningSection==="homework")renderLayout();}
        }

        function changeHomeworkFilter(field,value) {
            const h=homeworkUI();if(h.busy)return;
            if(h.dirty&&!confirm("BTVN chưa lưu. Bỏ phần đang sửa để chuyển?")){renderLayout();return;}
            h[field]=value;prepareHomeworkDraft();renderLayout();
        }

        function editHomework(index,field,value) {
            const h=homeworkUI();if(h.busy)return;
            const code=h.students[index].studentCode;
            h.draft[code][field]=value;h.dirty=true;
        }

        function markHomeworkComplete(){
            const h=homeworkUI();if(h.busy)return;
            if(Object.values(h.draft).some(r=>r.status&&r.status!=="done")&&!confirm("Đổi tất cả học sinh thành Hoàn thành?"))return;
            h.students.forEach(s=>{h.draft[s.studentCode].status="done";});h.dirty=true;renderLayout();
        }

        function renderHomework(){
            const h=homeworkUI(),esc=escapeHtmlText,disabled=h.busy?"disabled":"";
            const button="px-4 py-3 rounded-xl border font-bold disabled:opacity-50";
            const subjects={TOAN:"Toán",VAN:"Văn",ANH:"Anh",LY:"Lý",HOA:"Hoá",SINH:"Sinh"};
            return `<section class="bg-white rounded-3xl border border-slate-200 p-5 md:p-7 space-y-5">
            <h2 class="font-black text-2xl">Bài tập về nhà</h2>
            <div class="flex flex-wrap gap-3">
            <button ${disabled} onclick="loadHomework()" class="${button} text-emerald-700">Tải BTVN mới nhất</button>
            <button ${disabled} onclick="openConnectedGoogleSheet()" class="${button} text-blue-700">Mở Google Sheet</button></div>
            ${!h.loaded?'<p class="text-slate-500">'+(h.busy?"Đang tải BTVN…":"Bấm Tải BTVN mới nhất để lấy danh sách học sinh.")+'</p>':`
            <fieldset ${disabled} class="space-y-5">
            <div class="grid sm:grid-cols-2 gap-4">
            <label class="font-bold">Môn học<select aria-label="Môn BTVN" onchange="changeHomeworkFilter('subjectCode',this.value)" class="block mt-2 w-full border rounded-xl p-3">${Object.entries(subjects).map(([k,v])=>`<option value="${k}" ${k===h.subjectCode?"selected":""}>${v}</option>`).join("")}</select></label>
            <label class="font-bold">Ngày kiểm tra BTVN<input aria-label="Ngày kiểm tra BTVN" type="date" value="${esc(h.date)}" onchange="changeHomeworkFilter('date',this.value)" class="block mt-2 w-full border rounded-xl p-3"></label></div>
            <label class="block font-bold">Bài tập (không bắt buộc)<input maxlength="200" value="${esc(h.title)}" oninput="homeworkUI().title=this.value;homeworkUI().dirty=true" class="block mt-2 w-full border rounded-xl p-3" placeholder="Ví dụ: Bài 1–5 trang 20"></label>
            <div class="flex flex-wrap gap-3"><button onclick="markHomeworkComplete()" class="${button} bg-emerald-50 text-emerald-700">Cả lớp hoàn thành</button><button onclick="saveHomeworkUI()" class="${button} bg-indigo-600 text-white">${h.busy?"Đang lưu…":"Lưu BTVN"}</button></div>
            <p class="text-sm text-slate-500">Chọn cả lớp hoàn thành, sau đó chọn riêng các em chưa làm hoặc làm chưa đủ. “Chưa ghi nhận” không tính là hoàn thành. Mỗi môn và ngày lưu một lần kiểm tra.</p>

        async function saveHomeworkUI(){
            const h=homeworkUI();if(h.busy||!h.loaded)return;
            const records=h.students.map(s=>({studentCode:s.studentCode,...h.draft[s.studentCode]})).filter(r=>r.status);
            if(!records.length)return showToast("Chưa có trạng thái BTVN để lưu.","error");
            const key=getGoogleAdminKey();if(!key)return;
            const input={date:h.date,subjectCode:h.subjectCode,title:h.title,records:[]};
            h.busy=true;renderLayout();let saved=0;
            try {
                let batch=[];
                const batches=[];
                for(const r of records){
                    const test=[...batch,r];
                    if(batch.length&&(test.length>4||encodeURIComponent(JSON.stringify({...input,records:test})).length>6000)){batches.push(batch);batch=[];}
                    batch.push(r);
                }
                if(batch.length)batches.push(batch);
                for(const items of batches){await homeworkRequest("homework-save",{adminKey:key,homework:JSON.stringify({...input,records:items})});saved+=items.length;}
                const fresh=await homeworkRequest("homework",{adminKey:key});h.records=fresh.records;h.students=fresh.students;prepareHomeworkDraft();
                rememberGoogleAdminKey(key);showToast("Đã lưu BTVN cho "+saved+" học sinh.","success");
            }catch(e){showToast("Đã xác nhận lưu "+saved+"/"+records.length+" học sinh. "+e.message,"error");}
            finally{h.busy=false;renderLayout();}
        }

        function requestScoreBookGoogle(mode, params) {
            return new Promise(function(resolve, reject) {
                const callbackName = "googleScoreBookCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                const script = document.createElement("script");
                let finished = false;
                const timeout = setTimeout(function() { finish({ ok: false, message: "Hệ thống phản hồi chậm khi xử lý dữ liệu điểm." }); }, 30000);
                function cleanup() { clearTimeout(timeout); delete window[callbackName]; script.remove(); }
                function finish(response) {
                    if (finished) return;
                    finished = true; cleanup();
                    if (!response || !response.ok || !response.scoreBook) {
                        if (response && response.message === "Mã quản trị không chính xác.") clearGoogleAdminKey();
                        reject(new Error((response && response.message) || "Không thể xử lý dữ liệu điểm.")); return;
                    }
                    resolve(response);
                }
                window[callbackName] = finish;
                script.onerror = function() { finish({ ok: false, message: "Không thể kết nối Google Sheet." }); };
                const query = Object.keys(params || {}).map(function(key) { return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]); }).join("&");
                script.src = getApiUrl("mode=" + encodeURIComponent(mode) + (query ? "&" + query : "") + "&callback=" + callbackName);
                document.head.appendChild(script);
            });
        }

        window.loadScoreBookFromGoogle = function loadScoreBookFromGoogle(options) {
            options = options || {};
            if (state.scoreBook && state.scoreBook.loading) return;
            if (options.silent && state.scoreBook && state.scoreBook.loaded) return;
            const adminKey = getGoogleAdminKey();
            if (!adminKey) return;
            state.scoreBook.loading = true;
            if (state.currentTab === "diem-hoc-tap") renderLayout();
            requestScoreBookGoogle("score-book", { adminKey: adminKey }).then(function(response) {
                const oldSubject = state.scoreBook.selectedSubject || "TOAN";
                const oldTest = state.scoreBook.selectedTestCode || "";
                state.scoreBook = response.scoreBook;
                state.scoreBook.selectedSubject = oldSubject;
                state.scoreBook.selectedTestCode = (state.scoreBook.tests || []).some(function(test) { return test.code === oldTest; }) ? oldTest : "";
                state.scoreBook.draftTest = null; state.scoreBook.loaded = true; state.scoreBook.loading = false; state.scoreBook.updatedAt = response.updatedAt || "";
                rememberGoogleAdminKey(adminKey); saveData();
                if (state.currentTab === "diem-hoc-tap") renderLayout();
                if (!options.silent) showToast("Đã đồng bộ dữ liệu điểm từ Google Sheet.", "success");
            }).catch(function(error) {
                state.scoreBook.loading = false;
                if (state.currentTab === "diem-hoc-tap") renderLayout();
                showToast(error.message || "Không thể tải dữ liệu điểm.", "error");
            });
        };

        window.handleScoreGridPaste = function handleScoreGridPaste(event, startRow, startColumn) {
            const text = event.clipboardData && event.clipboardData.getData("text");
            if (!text || (!text.includes("\t") && !/[\r\n]/.test(text))) return;
            event.preventDefault();
            const pastedRows = text.replace(/\r/g, "").split("\n").filter(function(line) { return line.length > 0; }).map(function(line) { return line.split("\t"); });
            const rows = Array.from(document.querySelectorAll(".score-entry-row"));
            pastedRows.forEach(function(cells, rowOffset) {
                const row = rows[startRow + rowOffset]; if (!row) return;
                const fields = ["score", "note"];
                cells.forEach(function(value, columnOffset) {
                    const field = fields[startColumn + columnOffset]; if (!field) return;
                    const input = row.querySelector('[data-score-field="' + field + '"]');
                    if (input) input.value = String(value || "").trim();
                });
            });
        };

        window.saveScoreBook = function saveScoreBook() {
            const book = state.scoreBook || {};
            const selectedTest = book.selectedTestCode === "__new__" ? book.draftTest : (book.tests || []).find(function(test) { return test.code === book.selectedTestCode; });
            if (!selectedTest) return showToast("Vui lòng chọn bài kiểm tra.", "error");
            const adminKey = getGoogleAdminKey(); if (!adminKey) return;
            const inputs = Array.from(document.querySelectorAll('[data-score-field="score"]'));
            const scores = []; let invalidStudent = "";
            inputs.forEach(function(input) {
                const code = input.dataset.studentCode;
                const raw = input.value.trim().replace(",", ".");
                const noteInput = document.querySelector('[data-score-field="note"][data-student-code="' + code + '"]');
                if (raw) {
                    const value = Number(raw);
                    if (!Number.isFinite(value) || value < 0 || value > 10) {
                        input.classList.add("border-red-400", "bg-red-50"); if (!invalidStudent) invalidStudent = code;
                    } else input.classList.remove("border-red-400", "bg-red-50");
                }
                scores.push({ studentCode: code, score: raw, note: noteInput ? noteInput.value.trim() : "" });
            });
            if (invalidStudent) return showToast("Điểm phải nằm trong khoảng 0 đến 10. Vui lòng kiểm tra học sinh " + invalidStudent + ".", "error");
            const button = document.getElementById("save-score-book-button");
            if (button) { button.disabled = true; button.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin"></i> Đang lưu...'; }
            requestScoreBookGoogle("score-book-save", { adminKey: adminKey, scoreData: JSON.stringify({
                test: { code: selectedTest.code === "__new__" ? "" : selectedTest.code, subjectCode: selectedTest.subjectCode, title: selectedTest.title, date: selectedTest.date },
                scores: scores
            }) }).then(function(response) {
                const subjectCode = selectedTest.subjectCode;
                state.scoreBook = response.scoreBook; state.scoreBook.selectedSubject = subjectCode;
                state.scoreBook.selectedTestCode = response.scoreBook.selectedTestCode || ""; state.scoreBook.draftTest = null;
                state.scoreBook.loaded = true; state.scoreBook.loading = false; state.scoreBook.updatedAt = response.updatedAt || "";
                rememberGoogleAdminKey(adminKey); saveData(); renderLayout();
                showToast("Đã lưu điểm lên Google Sheet. Trang PHHS sẽ đọc dữ liệu mới.", "success");
            }).catch(function(error) {
                if (button && button.isConnected) { button.disabled = false; button.innerHTML = '<i class="ph-bold ph-cloud-arrow-up"></i> Lưu điểm lên Sheet'; }

            } else if (pf.targetType === 'group') {
                targetSelectHtml = `
                    <div class="mb-6 animate-fade-in">
                        <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wide">Chọn Nhóm/Tổ:</label>
                        <div class="relative">
                            <select onchange="updatePointsForm('selectedTargetId', this.value)" class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-100 transition-all appearance-none cursor-pointer shadow-sm">
                                <option value="">-- Chọn nhóm/tổ --</option>

            } else {
                targetSelectHtml = `
                    <div class="mb-6 p-4 bg-purple-50 border border-purple-100 rounded-xl animate-fade-in flex items-center gap-3">
                        <div class="p-2 bg-purple-200 text-purple-700 rounded-lg"><i class="ph-fill ph-users-three text-xl"></i></div>
                        <div>
                            <div class="font-bold text-purple-800 text-sm">Áp dụng cho Cả Lớp</div>
                            <div class="text-[11px] text-purple-600 mt-0.5">Điểm sẽ được cập nhật cho tất cả ${state.students.length} học sinh.</div>
                        </div>
                    </div>
                `;
            }

            const criteriaList = isAdd ? state.criteria.positive : state.criteria.negative;
            const criteriaHtml = criteriaList.map((c, index) => {
                const colorClass = isAdd ? 'text-emerald-600 bg-emerald-50/50 hover:bg-emerald-50 hover:border-emerald-300 border-emerald-100/50' : 'text-red-600 bg-red-50/50 hover:bg-red-50 hover:border-red-300 border-red-100/50';
                const signText = isAdd ? '+' : '-';
                const typeParam = isAdd ? 'positive' : 'negative';
                
                return `
                    <div class="relative group h-full">
                        <button onclick="applyQuickCriterion('${escapeInlineJs(c.reason)}', ${c.points}, '${escapeInlineJs(c.category)}')" class="flex flex-col items-start p-3.5 rounded-xl border transition-all text-left w-full h-full ${colorClass}">
                            <div class="font-bold text-slate-700 text-sm mb-1 group-hover:text-slate-900 line-clamp-2 leading-snug pr-4">${c.reason}</div>
                            <div class="mt-auto font-black text-sm">${signText}${c.points}đ</div>

                        <button onclick="deleteCriterion('${typeParam}', ${index})" class="absolute top-2 right-2 text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 bg-white rounded-full shadow-sm" title="Xóa mẫu này">
                            <i class="ph-bold ph-x text-[10px]"></i>
                        </button>

                `;
            }).join('');

            const categories = ["Học tập", "Phong trào", "Kỷ luật", "Chuyên cần", "Nề nếp", "Khác"];
            const categoryOptionsHtml = categories.map(cat => `<option value="${cat}" ${pf.category === cat ? 'selected' : ''}>${cat}</option>`).join('');

            let finalPointsStr = `${sign}${pf.pointsVal > 0 ? pf.pointsVal : 0}đ`;
            let canSubmit = false;
            
            if (pf.pointsVal > 0 && pf.reason.trim() !== '') {
                if (pf.targetType === 'class') canSubmit = true;
                else if (pf.selectedTargetId) canSubmit = true;
            }

            return `
                <div class="max-w-2xl mx-auto space-y-6 animate-fade-in pb-20 pt-4">
                    <canvas id="confetti-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-50"></canvas>
                    
                    <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col">
                        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 flex items-center justify-between">
                            <h2 class="text-white font-black text-lg tracking-wide flex items-center gap-2">
                                <i class="ph-bold ph-plus-circle"></i> Công Cụ Cộng Điểm Thi Đua
                            </h2>
                            <button onclick="if(state.currentTab === 'cai-dat') { switchSettingsTab('thong-tin'); } else { switchTab('tong-quan'); }" class="text-white/80 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-colors">
                                <i class="ph-bold ph-x"></i>
                            </button>
                        </div>
                        
                        <div class="p-6 md:p-8 flex flex-col gap-6">
                            <div class="flex rounded-xl p-1 bg-slate-100 border border-slate-200/60 shadow-inner">
                                <button onclick="updatePointsForm('actionType', 'add')" class="flex-1 py-3 px-4 rounded-lg flex items-center justify-center gap-2 text-sm transition-all ${actionBtnClass(isAdd, true)}">
                                    <i class="ph-bold ph-plus-circle text-lg"></i> <span class="font-bold tracking-wide">Cộng Điểm Khen Thưởng</span>
                                </button>
                                <button onclick="updatePointsForm('actionType', 'subtract')" class="flex-1 py-3 px-4 rounded-lg flex items-center justify-center gap-2 text-sm transition-all ${actionBtnClass(!isAdd, false)}">
                                    <i class="ph-bold ph-minus-circle text-lg"></i> <span class="tracking-wide">Trừ Điểm Kỷ Luật</span>
                                </button>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Đối Tượng Áp Dụng:</label>
                                <div class="flex gap-2">
                                    <button onclick="updatePointsForm('targetType', 'student'); updatePointsForm('selectedTargetId', '');" class="flex-1 py-2.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2 ${targetBtnClass(pf.targetType === 'student')}">
                                        <i class="ph-fill ph-user text-lg"></i> Học Sinh
                                    </button>
                                    <button onclick="updatePointsForm('targetType', 'group'); updatePointsForm('selectedTargetId', '');" class="flex-1 py-2.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2 ${targetBtnClass(pf.targetType === 'group')}">
                                        <i class="ph-fill ph-users text-lg"></i> Nhóm
                                    </button>
                                    <button onclick="updatePointsForm('targetType', 'class'); updatePointsForm('selectedTargetId', 'class');" class="flex-1 py-2.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2 ${targetBtnClass(pf.targetType === 'class')}">
                                        <i class="ph-fill ph-users-three text-lg"></i> Cả Lớp
                                    </button>
                                </div>
                            </div>

                            ${targetSelectHtml}

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Chọn Mẫu Nhanh:</label>
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-[160px] overflow-y-auto custom-scrollbar pr-2 py-1 relative">
                                    ${criteriaHtml}
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Số Điểm Thay Đổi:</label>
                                    <div class="relative">
                                        <div class="absolute left-4 top-1/2 -translate-y-1/2 font-black text-lg ${isAdd ? 'text-emerald-600' : 'text-red-500'}">${sign}</div>
                                        <input type="number" id="pf-points-val" value="${pf.pointsVal || ''}" min="0" oninput="state.pointsForm.pointsVal = Math.abs(parseInt(this.value)||0); validatePointsForm();" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-black text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Phân Loại Thi Đua:</label>
                                    <div class="relative">
                                        <select onchange="updatePointsForm('category', this.value)" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-700 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all appearance-none">
                                            ${categoryOptionsHtml}
                                        </select>
                                        <i class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-base"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Lý Do / Nội Dung Thay Đổi Điểm <span class="text-red-500">*</span></label>
                                    <input type="text" id="pf-reason" value="${escapeHtmlAttr(pf.reason)}" oninput="state.pointsForm.reason = this.value; validatePointsForm();" placeholder="Vd: Đóng góp phong trào" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Ghi Chú Bổ Sung (Không bắt buộc):</label>
                                    <input type="text" id="pf-note" value="${escapeHtmlAttr(pf.note)}" oninput="state.pointsForm.note = this.value;" placeholder="Nhập ghi chú thêm cho phụ huynh hoặc học sinh..." class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-medium text-slate-600 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-100 shadow-sm transition-all italic">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-500 mb-2 uppercase tracking-widest">Người Thực Hiện:</label>
                                    <input type="text" readonly value="${escapeHtmlAttr(state.admin.role || state.admin.name)}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-purple-700 outline-none cursor-not-allowed shadow-inner">
                                </div>
                            </div>
                        </div>

                        <div class="p-6 bg-slate-50 border-t border-slate-200 flex justify-end gap-4 rounded-b-[2rem]">
                            <button onclick="resetPointsForm()" class="px-6 py-3.5 bg-white border border-slate-300 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition-colors text-sm shadow-sm">Khôi Phục</button>
                            <button id="points-submit-btn" onclick="executePointsSubmission()" class="px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 ${canSubmit ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed opacity-70'}" ${!canSubmit ? 'disabled' : ''}>
                                Xác Nhận & Kiểm Tra <span id="points-preview-badge" class="bg-white/20 px-2 py-0.5 rounded ml-1">${finalPointsStr}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.updatePointsForm = function(key, value) {
            state.pointsForm[key] = value;
            if (key === 'actionType') {
                state.pointsForm.pointsVal = 0;
                state.pointsForm.reason = '';
            }
            renderLayout();
        };

        window.validatePointsForm = function() {
            const pf = state.pointsForm;
            let canSubmit = false;
            
            if (pf.pointsVal > 0 && pf.reason.trim() !== '') {
                if (pf.targetType === 'class') canSubmit = true;
                else if (pf.selectedTargetId) canSubmit = true;
            }

            const btn = document.getElementById('points-submit-btn');
            const badge = document.getElementById('points-preview-badge');

            if (btn) {
                if (canSubmit) {
                    btn.disabled = false;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-emerald-600 text-white hover:bg-emerald-700";
                } else {
                    btn.disabled = true;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-slate-300 text-slate-500 cursor-not-allowed opacity-70";
                }
            }
            
            if (badge) {
                const sign = pf.actionType === 'add' ? '+' : '-';
                badge.innerText = `${sign}${pf.pointsVal > 0 ? pf.pointsVal : 0}đ`;
            }
        };

        window.applyQuickCriterion = function(reason, points, category) {
            state.pointsForm.reason = reason;
            state.pointsForm.pointsVal = points;
            state.pointsForm.category = category || 'Khác';
            renderLayout();
        };

        window.resetPointsForm = function() {
            state.pointsForm = {
                actionType: 'add', targetType: 'student', selectedTargetId: '', pointsVal: 0, category: 'Học tập', reason: '', note: ''
            };
            renderLayout();
        };

        window.executePointsSubmission = function() {
            const pf = state.pointsForm;
            const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
            
            if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
            if (!pf.reason.trim()) return showToast("Vui lòng nhập lý do!", "error");
            let targetStudents = [];
            let successMsg = "";
            
            if (pf.targetType === 'student') {
                const s = state.students.find(x => x.id.toString() === pf.selectedTargetId.toString());
                if (!s) return showToast("Vui lòng chọn học sinh!", "error");
                targetStudents.push(s);
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho ${s.name}`;
            } 
            else if (pf.targetType === 'group') {
                targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
                if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
            } 
            else if (pf.targetType === 'class') {
                targetStudents = [...state.students];
                if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
            }
            
            const currentReason = pf.reason.trim();
            const absVal = Math.abs(pointsToApply);
            const targetCriteriaList = pf.actionType === 'add' ? state.criteria.positive : state.criteria.negative;
            
            const isExist = targetCriteriaList.find(c => c.reason.toLowerCase() === currentReason.toLowerCase() && c.points === absVal);
            if (!isExist) {
                targetCriteriaList.push({
                    points: absVal,
                    reason: currentReason,
                    category: pf.category || 'Khác'
                });
            }
            
            const historyEntry = {
                id: Date.now(),
                date: new Date().toISOString(),
                points: pointsToApply,
                reason: currentReason + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`
            };
            
            targetStudents.forEach(s => {
                s.points = (s.points || 0) + pointsToApply;
                s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
                if (!s.history) s.history = [];
                s.history.push({...historyEntry, id: Date.now() + Math.random()}); 
            });
            saveData();
            
            state.pointsForm.pointsVal = 0;
            state.pointsForm.reason = '';
            state.pointsForm.note = '';
            
            renderLayout();
            showToast(successMsg, pointsToApply > 0 ? "success" : "error");
            if (pointsToApply > 0) triggerConfetti();
        };

        function selectStudentForRewards(id) { state.selectedStudentForRewards = id; renderLayout(); }

        function deleteCriterion(type, index) {
            if (confirm("Xóa tiêu chí này khỏi danh sách?")) { state.criteria[type].splice(index, 1); saveData(); renderLayout(); showToast("Đã xóa"); }
        }

        function renderViewDoiQua() {
            const selectedStudentId = state.selectedStudentForRewards || null;
            const student = state.students.find(s => s.id === selectedStudentId);
            const sortedStudents = [...state.students].sort((a, b) => (b.stars||0) - (a.stars||0));
            
            const studentListHtml = sortedStudents.map(s => `
                <button onclick="selectStudentForRewards(${toInlineJsValue(s.id)})" class="flex-shrink-0 w-32 rounded-2xl flex flex-col items-center justify-center p-4 transition-all duration-300 relative overflow-hidden group ${s.id === selectedStudentId ? 'bg-gradient-to-b from-blue-50 to-white border-2 border-blueAccent shadow-md transform -translate-y-2' : 'border border-slate-200 hover:bg-slate-50 bg-white hover:shadow-sm'}">
                    ${s.id === selectedStudentId ? '<div class="absolute top-0 w-full h-1 bg-blueAccent"></div>' : ''}
                    ${getAvatarImg(s.avatarUrl, s.name, "w-14 h-14 ring-2 ring-slate-100 shadow-sm mb-3 group-hover:scale-110 transition-transform")}
                    <div class="text-sm font-bold text-slate-800 truncate w-full text-center mb-2">${s.name.split(' ').pop()}</div>
                    <div class="text-xs font-black px-3 py-1 rounded-xl bg-orange-50 text-orange-600 border border-orange-100 flex items-center justify-center gap-1.5 w-full"><i class="ph-fill ph-star text-accent"></i> ${s.stars || 0}</div>
                </button>
            `).join('');

            const catalogHtml = (state.rewards || []).map(item => {
                let btnHtml = !student ? `<button class="w-full py-3.5 bg-slate-100 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Chọn học sinh</button>` : 
                              (student.stars || 0) >= item.cost ? `<button onclick="executeRedeem(${toInlineJsValue(student.id)}, '${escapeInlineJs(item.id)}')" class="w-full py-3.5 bg-primary hover:bg-secondary text-white font-bold rounded-xl text-xs uppercase tracking-wide shadow-md hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><i class="ph-bold ph-hand-coins text-lg"></i> Đổi quà</button>` :
                              `<button class="w-full py-3.5 bg-slate-50 border border-slate-200 text-slate-400 font-bold rounded-xl text-xs uppercase tracking-wide cursor-not-allowed">Thiếu ${item.cost - (student.stars||0)} sao</button>`;
                
                const imageDisplayHtml = item.imageUrl 
                    ? `<div class="w-full h-40 mb-5 bg-slate-50/80 rounded-2xl flex items-center justify-center overflow-hidden border border-slate-100 p-2 group-hover:shadow-md transition-all">
                           <img src="${item.imageUrl}" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500 drop-shadow-sm">
                       </div>`
                    : `<div class="w-16 h-16 ${item.bg} rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-sm border border-white ring-4 ring-slate-50"><i class="ph-fill ${item.icon} text-3xl ${item.color}"></i></div>`;

                return `
                    <div class="bg-white rounded-[2rem] p-2 shadow-sm hover:shadow-xl transition-all duration-300 group border border-slate-200 relative overflow-hidden flex flex-col h-full hover:-translate-y-2">
                        <div class="absolute top-0 right-0 w-32 h-32 ${item.bg.replace('100', '200')}/40 rounded-bl-full -mr-10 -mt-10 transition-transform duration-500 group-hover:scale-125 z-0"></div>
                        <div class="bg-white rounded-[1.6rem] p-6 md:p-8 flex flex-col h-full relative z-10">
                            ${imageDisplayHtml}
                            <h4 class="font-black text-slate-800 text-xl mb-2 leading-tight">${item.name}</h4>
                            ${item.desc ? `<p class="text-sm text-slate-500 mb-8 font-medium line-clamp-2">${item.desc}</p>` : '<div class="h-6 mb-8"></div>'}
                            <div class="mt-auto flex items-end justify-between mb-6 pt-5 border-t border-slate-100 border-dashed">
                                <div class="flex flex-col"><span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">CẦN ĐỂ ĐỔI</span><div class="flex items-center gap-1.5 font-black text-slate-800 text-3xl">${item.cost} <i class="ph-fill ph-star text-accent animate-pulse"></i></div></div>
                            </div>
                            ${btnHtml}
                        </div>
                    </div>
                `;
            }).join('');

        window.switchAttendanceTab = function(tab) { 
            state.attendanceTab = tab; 
            renderLayout(); 
        };

        window.attendanceSaveMeta = window.attendanceSaveMeta || {};
        window.attendanceAutoSaveTimers = window.attendanceAutoSaveTimers || {};
        window.attendanceSaveQueue = window.attendanceSaveQueue || Promise.resolve();

        function getAttendanceSaveMeta(date) {
            const key = String(date || "");
            if (!window.attendanceSaveMeta[key]) {
                window.attendanceSaveMeta[key] = {
                    status: "idle",
                    version: 0,
                    savedAt: "",
                    message: "",
                    pending: null
                };
            }
            return window.attendanceSaveMeta[key];
        }

        function renderAttendanceSaveStatus(date) {
            const meta = getAttendanceSaveMeta(date);
            let icon = "ph-cloud-check";
            let label = "Chưa có thay đổi mới";
            let classes = "bg-slate-50 text-slate-600 border-slate-200";

            if (meta.status === "dirty") {
                icon = "ph-cloud-arrow-up";
                label = "Có thay đổi chưa lưu · hệ thống sẽ tự lưu";
                classes = "bg-amber-50 text-amber-700 border-amber-200";
            } else if (meta.status === "saving") {
                icon = "ph-spinner-gap animate-spin";
                label = "Đang lưu lên Google Sheet...";
                classes = "bg-blue-50 text-blue-700 border-blue-200";
            } else if (meta.status === "saved") {
                icon = "ph-check-circle";
                const savedDate = new Date(meta.savedAt || "");
                const savedTime = Number.isNaN(savedDate.getTime())
                    ? ""
                    : savedDate.toLocaleTimeString("vi-VN");
                label = savedTime
                    ? "Đã lưu lên Sheet lúc " + savedTime
                    : "Đã lưu lên Google Sheet";
                classes = "bg-emerald-50 text-emerald-700 border-emerald-200";
            } else if (meta.status === "error") {
                icon = "ph-warning-circle";
                label = "Chưa lưu được · bấm “Lưu lên Sheet” để thử lại";
                classes = "bg-red-50 text-red-700 border-red-200";
            }

            return `
                <div class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl border ${classes}">
                    <div class="flex items-center gap-2 min-w-0">
                        <i class="ph-bold ${icon} text-lg flex-shrink-0"></i>
                        <span class="text-xs sm:text-sm font-bold">${label}</span>
                    </div>
                    ${meta.status === "error" && meta.message
                        ? `<span class="hidden lg:block text-xs truncate max-w-md" title="${escapeHtmlAttr(meta.message)}">${escapeHtmlText(meta.message)}</span>`
                        : ""}
                </div>
            `;
        }

        function refreshAttendanceSaveStatus(date) {
            if (String(date) !== String(currentAttendanceDate)) return;
            const statusElement = document.getElementById("attendance-save-status");
            if (statusElement) {
                statusElement.innerHTML = renderAttendanceSaveStatus(date);
            }

            const button = document.getElementById("attendance-upload-button");
            if (!button) return;
            const saving = getAttendanceSaveMeta(date).status === "saving";
            button.disabled = saving;
            button.innerHTML = saving
                ? '<i class="ph-bold ph-spinner-gap text-lg animate-spin"></i> Đang lưu...'
                : '<i class="ph-bold ph-cloud-arrow-up text-lg"></i> Lưu lên Sheet';
        }

        function markAttendanceDateDirty(date) {
            const meta = getAttendanceSaveMeta(date);
            meta.version += 1;
            meta.status = "dirty";
            meta.message = "";
            refreshAttendanceSaveStatus(date);
        }

        function buildAttendanceRecordsForDate(date) {
            const dayRecord = (state.attendanceRecords || {})[date] || {};
            return state.students
                .filter(student => String(student.studentCode || "").trim())
                .map(student => ({
                    date: String(date),
                    studentCode: String(student.studentCode),
                    status: String(dayRecord[student.id] || "")
                }));
        }

        function scheduleAttendanceAutoSave(date, delay = 900) {
            const key = String(date || "");
            clearTimeout(window.attendanceAutoSaveTimers[key]);
            window.attendanceAutoSaveTimers[key] = setTimeout(() => {
                delete window.attendanceAutoSaveTimers[key];
                enqueueAttendanceSave(key, { automatic: true })
                    .catch(error => {
                        const meta = getAttendanceSaveMeta(key);
                        if (!meta.errorNotified) {
                            meta.errorNotified = true;
                            showToast(
                                "Điểm danh đang được giữ trên máy nhưng chưa lưu lên Sheet. Hãy bấm “Lưu lên Sheet” để thử lại.",
                                "error"
                            );
                        }
                    });
            }, delay);
        }

        function enqueueAttendanceSave(date, options = {}) {
            const key = String(date || "").trim();
            const meta = getAttendanceSaveMeta(key);
            if (meta.pending) return meta.pending;

            clearTimeout(window.attendanceAutoSaveTimers[key]);
            delete window.attendanceAutoSaveTimers[key];

            const queuedTask = (window.attendanceSaveQueue || Promise.resolve())
                .catch(() => {})
                .then(async () => {
                    const activeMeta = getAttendanceSaveMeta(key);
                    const savingVersion = activeMeta.version;
                    const records = buildAttendanceRecordsForDate(key);

                    if (!records.length) {
                        const noStudentsError = new Error("Không có học sinh có mã để lưu điểm danh.");
                        activeMeta.status = "error";
                        activeMeta.message = noStudentsError.message;
                        refreshAttendanceSaveStatus(key);
                        throw noStudentsError;
                    }

                    activeMeta.status = "saving";
                    activeMeta.message = "";
                    refreshAttendanceSaveStatus(key);

                    try {
                        await sendAttendanceInChunks(records);
                        activeMeta.savedAt = new Date().toISOString();
                        activeMeta.errorNotified = false;

                        if (activeMeta.version === savingVersion) {
                            activeMeta.status = "saved";
                        } else {
                            activeMeta.status = "dirty";
                            scheduleAttendanceAutoSave(key, 500);
                        }

                        refreshAttendanceSaveStatus(key);
                        return {
                            savedCount: records.length,
                            automatic: Boolean(options.automatic)
                        };
                    } catch (error) {
                        activeMeta.status = "error";
                        activeMeta.message = (error && error.message) || "Không thể lưu điểm danh.";
                        refreshAttendanceSaveStatus(key);
                        throw error;
                    }
                });

            meta.pending = queuedTask;
            window.attendanceSaveQueue = queuedTask.catch(() => {});
            queuedTask.then(
                () => { if (meta.pending === queuedTask) meta.pending = null; },
                () => { if (meta.pending === queuedTask) meta.pending = null; }
            );
            return queuedTask;
        }

        function renderViewDiemDanh() {
            if (!state.attendanceRecords) state.attendanceRecords = {};
            if (!state.attendanceTab) state.attendanceTab = 'diem-danh';
            let contentHtml = '';

            if (state.attendanceTab === 'diem-danh') {
                if (!state.attendanceRecords[currentAttendanceDate]) state.attendanceRecords[currentAttendanceDate] = {};
                const currentRecord = state.attendanceRecords[currentAttendanceDate];
                const sortedDates = Object.keys(state.attendanceRecords).sort((a,b) => new Date(b) - new Date(a));

                const tableRowsHtml = state.students.map((s, idx) => {
                    const status = currentRecord[s.id] || null;
                    
                    const renderButton = (val, label, colorTheme) => {
                        const isChecked = status === val;
                        let activeClass = '', idleClass = '';
                        
                        if (colorTheme === 'emerald') { activeClass = 'bg-white text-emerald-500 border-emerald-500'; idleClass = 'bg-white text-emerald-500/50 border-emerald-500/30 hover:border-emerald-500/50'; }
                        else if (colorTheme === 'yellow') { activeClass = 'bg-white text-yellow-500 border-yellow-500'; idleClass = 'bg-white text-yellow-500/50 border-yellow-500/30 hover:border-yellow-500/50'; }
                        else if (colorTheme === 'blue') { activeClass = 'bg-white text-blue-500 border-blue-500'; idleClass = 'bg-white text-blue-500/50 border-blue-500/30 hover:border-blue-500/50'; }
                        else if (colorTheme === 'red') { activeClass = 'bg-white text-red-500 border-red-500'; idleClass = 'bg-white text-red-500/50 border-red-500/30 hover:border-red-500/50'; }
                        
                        return `<button onclick="markAttendance(${toInlineJsValue(s.id)}, '${val}')" class="w-full h-11 rounded-[0.8rem] border-[1.5px] ${isChecked ? activeClass + ' font-bold' : idleClass + ' font-medium'} transition-colors text-xs flex items-center justify-center">${label}</button>`;
                    };

                    let lateDates = [], excusedDates = [], unexcusedDates = [];
                    sortedDates.forEach(date => {
                        const dStatus = state.attendanceRecords[date][s.id];
                        if (!dStatus || dStatus === 'present') return;
                        const p = date.split('-'); const formattedDate = `${p[2]}/${p[1]}`;
                        if (dStatus === 'late') lateDates.push(formattedDate); 
                        else if (dStatus === 'excused') excusedDates.push(formattedDate); 
                        else if (dStatus === 'unexcused') unexcusedDates.push(formattedDate);
                    });

                    let historyHtml = '';
                    if (lateDates.length > 0 || excusedDates.length > 0 || unexcusedDates.length > 0) {
                        let badges = '';
                        if (lateDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Đi muộn</span> <span class="text-xs text-slate-600 font-medium">${lateDates.join(', ')}</span></div>`;
                        if (excusedDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Vắng (P)</span> <span class="text-xs text-slate-600 font-medium">${excusedDates.join(', ')}</span></div>`;
                        if (unexcusedDates.length > 0) badges += `<div class="flex items-center gap-3"><span class="bg-red-100 text-red-500 px-2 py-1 rounded text-[10px] font-bold w-16 text-center">Vắng (KP)</span> <span class="text-xs text-slate-600 font-medium">${unexcusedDates.join(', ')}</span></div>`;
                        
                        historyHtml = `
                            <div class="mt-4 flex flex-col gap-2 pl-2 border border-dashed border-slate-200 rounded-xl p-3 bg-slate-50/50 ml-14 w-max min-w-[250px]">
                                <div class="text-[9px] font-bold uppercase tracking-widest text-slate-400 mb-1">LỊCH SỬ VI PHẠM CHUYÊN CẦN</div>
                                <div class="flex flex-col gap-1.5">${badges}</div>
                            </div>

                        </div>
                    </div>
                    <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden relative z-10">
                        <div class="py-4 border-b border-slate-100 bg-slate-50 px-6 md:px-8 flex-shrink-0 flex justify-between items-center">
                            <div class="text-[11px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i class="ph-fill ph-users text-lg"></i> DANH SÁCH HỌC SINH - NGÀY ${formatDateForDisplay(currentAttendanceDate)}</div>

                        <div id="attendance-student-list" class="overflow-y-auto flex-1 custom-scrollbar">${tableRowsHtml || '<div class="p-16 text-center text-slate-400 font-medium text-lg">Chưa có dữ liệu học sinh. Vui lòng thêm học sinh trước.</div>'}</div>

            } else {
                const allDates = Object.keys(state.attendanceRecords).sort((a,b) => new Date(a) - new Date(b));

                const tableBodyRows = state.students.map((s, index) => {

                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-3"><i class="ph-fill ph-calendar-check text-emerald-500"></i> Quản lý Chuyên Cần</h2>
                            <p class="text-slate-500 text-sm font-medium mt-1">Theo dõi việc đi học hàng ngày của học sinh</p>

                    </div>
                    ${contentHtml}
                </div>
